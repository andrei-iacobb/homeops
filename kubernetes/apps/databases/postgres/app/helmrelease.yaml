---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
spec:
  chartRef:
    kind: OCIRepository
    name: postgres
  interval: 1h
  values:
    controllers:
      postgres:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/andrei-iacobb/patched/immich-postgres
              tag: 18-vectorchord1.1.1-pgvector0.8.7-p20261128@sha256:ed76c7946da226d01613544d5848b5ca759d464343467cda982ead677abf4431
            env:
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_PASSWORD
              POSTGRES_USER: postgres
              POSTGRES_DB: postgres
              # PG 18 lives on its own PVC (postgres-pg18). The immich entrypoint puts
              # the cluster in $PGDATA/18. The PG 17 (pgdata17) and PG 16 (pgdata)
              # clusters stay untouched on the old `postgres` PVC as the rollback.
              PGDATA: /var/lib/postgresql/data/pgdata18
              IMMICH_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: IMMICH_DB_PASSWORD
              VAULTWARDEN_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: VAULTWARDEN_DB_PASSWORD
              GITEA_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: GITEA_DB_PASSWORD
              AUTHENTIK_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: AUTHENTIK_DB_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U postgres
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - pg_isready -U postgres
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # Data dirs are already 999-owned; skip the recursive chown/chmod so the
        # legacy PVC below is not rewritten on every start.
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          postgres:
            port: 5432
    persistence:
      # Pre-2026-11-27 PVC `postgres` (PG 16 + PG 17 clusters). Kept under the same
      # key so Helm leaves the claim alone; mounted read-only and unused. It is the
      # rollback for the PG 18 upgrade - drop once PG 18 has proven itself.
      data:
        type: persistentVolumeClaim
        retain: true
        storageClass: openebs-hostpath
        size: 50Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/lib/postgresql-legacy
            readOnly: true
      pg18:
        type: persistentVolumeClaim
        existingClaim: postgres-pg18
        globalMounts:
          - path: /var/lib/postgresql/data
      init:
        type: configMap
        name: postgres-init
        globalMounts:
          - path: /docker-entrypoint-initdb.d
