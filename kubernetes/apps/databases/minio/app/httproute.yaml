---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - minio.iacob.uk
  rules:
    - backendRefs:
        - name: minio
          port: 9001
---
# S3 API for uploads (Shottr). Internal only - LAN and WireGuard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-s3
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - s3.iacob.uk
  rules:
    - backendRefs:
        - name: minio
          port: 9000
