---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - minio.iacob.uk
  rules:
    - backendRefs:
        - name: minio
          port: 9001
---
# S3 API for uploads (Shottr). Internal only - LAN and WireGuard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-s3
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - s3.iacob.uk
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# Public read-only view of the shottr bucket. GET/HEAD only, every path is
# rewritten into the bucket so no other bucket or API call is reachable.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-shots
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - shots.iacob.co.uk
  rules:
    - matches:
        - method: GET
          path: {type: PathPrefix, value: /}
      filters: &rewrite
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /shottr/
      backendRefs: &backend
        - name: minio
          port: 9000
    - matches:
        - method: HEAD
          path: {type: PathPrefix, value: /}
      filters: *rewrite
      backendRefs: *backend
