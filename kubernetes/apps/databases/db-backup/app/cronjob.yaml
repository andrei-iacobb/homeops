---
# Logical PostgreSQL backups (pg_dumpall) uploaded to TrueNAS MinIO.
# Complements VolSync PVC snapshots with consistent, portable .sql.gz dumps.
# Writes into the existing `volsync` bucket under the db-logical/ prefix,
# reusing the same S3 credentials VolSync already uses (no new bucket needed).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-logical-backup
spec:
  schedule: "0 2 * * *" # daily 02:00 UTC (before VolSync's 02:00+ PVC backups spread out)
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            fsGroup: 0
          initContainers:
            # Copy the pinned client from its image without downloading tools at
            # job runtime. mc copies itself without relying on a shell in its image.
            - name: fetch-mc
              image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
              imagePullPolicy: IfNotPresent
              command: ["/usr/bin/mc"]
              args: ["cp", "/usr/bin/mc", "/tools/mc"]
              env:
                # Keep any client configuration on the shared writable volume.
                - name: HOME
                  value: /tools
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: pg-logical-backup
              # Pin the backup client independently of the shared database server.
              image: postgres:16.15-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              env:
                - name: PGHOST
                  value: postgres.databases.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: volsync-secret
                      key: VOLSYNC_S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: volsync-secret
                      key: VOLSYNC_S3_BUCKET
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: volsync-secret
                      key: VOLSYNC_S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: volsync-secret
                      key: VOLSYNC_S3_SECRET_KEY
                - name: PREFIX
                  value: db-logical
                - name: KEEP_DAILY
                  value: "30"
                - name: KEEP_MONTHLY
                  value: "12"
              volumeMounts:
                - name: tools
                  mountPath: /tools
              command:
                - /bin/sh
                - -euc
                - |
                  # mc arrives from the init container through the shared emptyDir.
                  # Set its executable mode explicitly and put /tools on PATH.
                  export PATH="/tools:$PATH"
                  chmod 0755 /tools/mc
                  # Check compatibility before starting the database dump.
                  if ! mc --version >/dev/null 2>&1; then
                    echo "[setup] ERROR /tools/mc is not executable on this image" && exit 1
                  fi
                  echo "[setup] $(mc --version | head -1)"

                  TS=$(date -u +"%Y%m%dT%H%M%SZ")
                  FILE="/tmp/postgres_${TS}.sql.gz"

                  echo "[dump] pg_dumpall from ${PGHOST}"
                  # sh has no pipefail: dump to a temp file first so a pg_dumpall
                  # failure (partial or total) fails the job instead of uploading
                  # a truncated dump that gzip would happily 0-exit on.
                  pg_dumpall -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --clean --if-exists > /tmp/dump.sql
                  gzip -9 < /tmp/dump.sql > "$FILE"
                  echo "[dump] size $(du -h "$FILE" | cut -f1)"

                  # sanity: dump must contain the expected trailer pg_dumpall writes
                  # last, which only appears if the dump ran to completion.
                  if ! tail -c 4096 /tmp/dump.sql | grep -q "PostgreSQL database cluster dump complete"; then
                    echo "[dump] ERROR dump did not complete cleanly" && exit 1
                  fi
                  rm -f /tmp/dump.sql

                  echo "[upload] configuring mc -> ${S3_ENDPOINT}"
                  mc alias set store "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY" --api S3v4 >/dev/null
                  mc cp "$FILE" "store/${S3_BUCKET}/${PREFIX}/postgres_${TS}.sql.gz"
                  echo "[upload] done -> ${S3_BUCKET}/${PREFIX}/postgres_${TS}.sql.gz"

                  echo "[retention] keep ${KEEP_DAILY} daily + ${KEEP_MONTHLY} monthly"
                  ALL=$(mc ls "store/${S3_BUCKET}/${PREFIX}/" | awk '{print $NF}' \
                    | grep -E '^postgres_.*\.sql\.gz$' | sort -r)
                  i=0; months=""
                  for obj in $ALL; do
                    if [ "$i" -lt "$KEEP_DAILY" ]; then i=$((i+1)); continue; fi
                    ym=$(echo "$obj" | sed -E 's/postgres_([0-9]{6}).*/\1/')
                    kept_months=$(echo "$months" | tr ';' '\n' | grep -c "^${ym}$" || true)
                    monthcount=$(echo "$months" | tr ';' '\n' | grep -v '^$' | sort -u | wc -l)
                    if [ "$kept_months" -eq 0 ] && [ "$monthcount" -lt "$KEEP_MONTHLY" ]; then
                      months="${months}${ym};"
                    else
                      echo "[retention] delete $obj"
                      mc rm "store/${S3_BUCKET}/${PREFIX}/${obj}" >/dev/null || true
                    fi
                  done

                  rm -f "$FILE"
                  echo "[done] backup complete"
          volumes:
            # Carries mc from the init container to the backup container.
            - name: tools
              emptyDir: {}
