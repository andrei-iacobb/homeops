---
# Code namespace: T3 Code workspace servers. Ingress only from the envoy
# gateways, monitoring and kubelet probes. Egress is unrestricted - the agents
# inside need git, package registries and the model providers.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: code-ingress
  namespace: code
spec:
  endpointSelector: {}
  ingress:
    # Envoy Gateway ingress (internal HTTPRoutes only)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
    # Intra-namespace
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: code
    # Monitoring namespace (prometheus scraping)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # Kubelet health probes
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cliproxy-slate
  namespace: code
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: slate
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cliproxy-spill
  namespace: code
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            app.kubernetes.io/name: spill
      toPorts:
        - ports:
            - port: "8317"
              protocol: TCP
---
# The fleet desktops (webtop sidecars, :3000) have no auth of their own and a
# passwordless-sudo terminal. Only Envoy (behind Authentik) and Homepage may
# reach them; deny overrides the broad intra-namespace and monitoring allows
# above, so one worker's agents cannot open another worker's desktop. The
# pod-local adx relay uses loopback and is not affected.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: code-desktop-deny
  namespace: code
spec:
  endpointSelector: {}
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: code
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
