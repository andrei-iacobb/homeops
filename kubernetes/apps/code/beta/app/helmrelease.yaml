---
# beta - T3 Code workspace (one environment server per pod, driven from the
# T3 Code desktop / web / mobile clients). Image is dizys/t3code-docker: the
# t3 server plus the claude, codex, cursor, opencode and grok CLIs, language
# toolchains and a headless chromium MCP, with a pairing console on :3774.
# Internal only: https://beta.iacob.uk (pairing console at /__setup). Off-LAN
# access is via WireGuard. Load balancing across the fleet is done by the T3
# clients (Settings -> Connections -> Load balancing), not by anything here.
# State: /home/t3 (sqlite, provider logins, worktrees) and /workspace (repos).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beta
spec:
  chartRef:
    kind: OCIRepository
    name: beta
  interval: 1h
  values:
    controllers:
      beta:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dizys/t3code-docker
              # Plain X.Y.Z is the browser variant. Upstream retired -full/-slim after
              # 0.18.0, and a suffixed tag hides every newer release from Renovate.
              tag: 0.28.2
            env:
              TZ: Europe/London
              PUID: "1000"
              PGID: "1000"
              T3CODE_HOST: 0.0.0.0
              T3CODE_PORT: &port 3773
              T3_SETUP_PORT: &setup 3774
              T3_SETUP_ENABLED: "1"
              T3_SETUP_BASE_PATH: /__setup
              T3_PUBLIC_URL: https://beta.iacob.uk
              T3_WORKSPACE: /workspace
              T3_AUTO_ADD_PROJECTS: "1"
              T3_ALLOW_SUDO: "1"
              T3_PAIR_TTL: 30d
              T3_PRINT_PAIRING_ON_START: "0"
            envFrom:
              - secretRef:
                  name: beta-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.well-known/t3/environment
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.well-known/t3/environment
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /.well-known/t3/environment
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
            # The entrypoint starts as root to fix ownership on the volumes,
            # then drops to uid 1000 (gosu). Agents get passwordless sudo
            # inside the container (T3_ALLOW_SUDO), so no caps are dropped.
            securityContext:
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "8"
                memory: 24Gi
          # Desktop for the agents and for Andrei to watch: XFCE + Chromium,
          # streamed by Selkies on :3000, shown at https://beta-desktop.iacob.uk
          # (Authentik). Agents drive it with agent-desktop via `adx`; setup and
          # the gate live in ../../desktop-adx.yaml. Shares /home/t3, /workspace
          # and /dev/shm with the app container (same uid 1000).
          desktop:
            image:
              repository: lscr.io/linuxserver/webtop
              tag: debian-xfce-536c698c-ls219
            env:
              TZ: Europe/London
              PUID: "1000"
              PGID: "1000"
              TITLE: beta desktop
              # Stream at the browser's CSS resolution and let it scale up: the
              # desktop stays at 96 DPI, so panels and title bars (fixed pixel
              # sizes) are not microscopic on HiDPI screens.
              SELKIES_USE_CSS_SCALING: "true"
            # ephemeral-storage bounds the container layer (firefox-esr is
            # reinstalled there on each start): overflow evicts this pod, not
            # the whole node.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "2"
                memory: 3Gi
                ephemeral-storage: 3Gi
    defaultPodOptions:
      terminationGracePeriodSeconds: 30
    service:
      app:
        controller: beta
        ports:
          http:
            port: *port
          setup:
            port: *setup
          desktop:
            port: 3000
    persistence:
      home:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 20Gi
        globalMounts:
          - path: /home/t3
      workspace:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 60Gi
        globalMounts:
          - path: /workspace
      desktop-config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: openebs-hostpath
        size: 5Gi
        advancedMounts:
          beta:
            desktop:
              - path: /config
      desktop-adx:
        type: configMap
        name: desktop-adx
        defaultMode: 493 # 0755
        advancedMounts:
          beta:
            desktop:
              - path: /custom-cont-init.d/50-adx-setup
                subPath: 50-adx-setup
              - path: /custom-cont-init.d/60-adx-look
                subPath: 60-adx-look
              - path: /opt/adx/adx-wallpaper.py
                subPath: adx-wallpaper.py
              - path: /custom-services.d/adx-relay
                subPath: adx-relay
              - path: /opt/adx/adx-local
                subPath: adx-local
              - path: /opt/adx/adx-relay.py
                subPath: adx-relay.py
            app:
              - path: /usr/local/bin/adx-local
                subPath: adx-local-client
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
    route:
      internal:
        # Keep the name `beta`: sso-bypass.yaml targets it, and a second
        # route would otherwise rename this one to `beta-internal`.
        forceRename: "{{ .Release.Name }}"
        hostnames: ["beta.iacob.uk"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /__setup
            backendRefs:
              - identifier: app
                port: *setup
          - backendRefs:
              - identifier: app
                port: *port
      desktop:
        hostnames: ["beta-desktop.iacob.uk"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
