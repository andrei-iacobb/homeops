---
# Shared by the alpha/beta/gamma desktop sidecars (linuxserver webtop, XFCE,
# streamed with Selkies at https://<worker>-desktop.iacob.uk behind Authentik).
# Agents drive the desktop with vercel-labs/agent-desktop through `adx`:
#   - inside the pod: `adx local ...` -> adx-local client -> relay on
#     127.0.0.1:7801 (pod loopback only) -> adx-local gate in the desktop
#   - from the Mac:   `adx alpha ...` -> kubectl exec -c desktop adx-local
# Kill switch: touch /config/.agent-desktop/remote-disabled in the desktop
# container. Audit log (caller + command name only): same dir, remote.log.
# Both are advisory: an agent driving the GUI can open the desktop's terminal
# (passwordless sudo) and undo them. Cut in-pod agents off with
#   kubectl -n code exec <w>-0 -c desktop -- s6-svc -d /run/service/custom-svc-adx-relay
# (also undoable from that terminal); the only absolute stop is removing the
# sidecar or scaling the worker to zero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: desktop-adx
data:
  # /custom-cont-init.d: runs as root before the desktop services start.
  50-adx-setup: |
    #!/bin/bash
    set -euo pipefail
    VER=1.0.2
    SHA=ad661b7a3fd8f990a769243f4889a240ca0e2c8dab3ef5bddd6019086c71e0b4
    DIR=/config/.adx/agent-desktop-$VER
    # Extract into a temporary sibling and rename only after the binary runs,
    # so an interrupted install can never leave a cached half-written binary.
    if ! "$DIR/agent-desktop" version >/dev/null 2>&1; then
      mkdir -p /config/.adx
      tmp=$(mktemp -d /config/.adx/.install.XXXXXX)
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL --retry 3 -o "$tmp/ad.tgz" \
        "https://github.com/vercel-labs/agent-desktop/releases/download/v$VER/agent-desktop-v$VER-x86_64-unknown-linux-gnu.tar.gz"
      echo "$SHA  $tmp/ad.tgz" | sha256sum -c -
      mkdir "$tmp/out"
      tar -xzf "$tmp/ad.tgz" -C "$tmp/out"
      "$tmp/out/agent-desktop" version >/dev/null
      rm -rf "$DIR"
      mv "$tmp/out" "$DIR"
      chown -R abc:abc /config/.adx
    fi
    ln -sf "$DIR/agent-desktop" /usr/local/bin/agent-desktop
    install -m 0755 /opt/adx/adx-local /usr/local/bin/adx-local
    install -m 0644 /opt/adx/adx-relay.py /usr/local/lib/adx-relay.py
    # Chromium needs this for page content on AT-SPI. Do not add
    # ACCESSIBILITY_ENABLED=1: it forces the legacy ATK bridge.
    printf '%s\n' \
      '# adx: expose page content on AT-SPI for agent-desktop' \
      'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --force-renderer-accessibility"' \
      > /etc/chromium.d/zz-accessibility
    install -d -m 0700 -o abc -g abc /config/.agent-desktop
    echo "adx: agent-desktop $VER ready"
    # Firefox ESR is the browser agents type into: Chromium 156 (Debian)
    # segfaults in its AT-SPI bridge when Enter is pressed in the omnibox while
    # agent-desktop is attached. Lives in the container layer (~300M), so it is
    # reinstalled on each start; a failure here leaves the desktop usable.
    if ! command -v firefox-esr >/dev/null; then
      ( apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
          apt-get install -y -qq --no-install-recommends firefox-esr ) >/dev/null 2>&1 \
        && echo "adx: firefox-esr installed" || echo "adx: WARNING firefox-esr install failed"
    fi

  # /custom-services.d: s6 longrun, the pod-local relay.
  adx-relay: |
    #!/usr/bin/with-contenv bash
    exec s6-setuidgid abc "$(command -v python3)" /usr/local/lib/adx-relay.py

  # Desktop-side gate. Every path into this desktop goes through here.
  adx-local: |
    #!/bin/bash
    set -euo pipefail
    STATE=/config/.agent-desktop
    CALLER=${ADX_CALLER:-kubectl-exec}
    if [ "$(id -u)" = 0 ]; then
      exec s6-setuidgid abc env ADX_CALLER="$CALLER" "$0" "$@"
    fi
    mkdir -p "$STATE"
    # Log the command name: the first argument that is not a global flag.
    cmd=""; for a in "$@"; do case $a in -*) ;; *) cmd=$a; break;; esac; done
    name=$(printf '%s' "${cmd:-${1:-}}" | head -c 40 | tr -c 'A-Za-z0-9._-' '?')
    caller=$(printf '%s' "$CALLER" | head -c 40 | tr -c 'A-Za-z0-9._-' '?')
    if [ -e "$STATE/remote-disabled" ]; then
      echo "$(date +%FT%T) $caller DENIED $name" >> "$STATE/remote.log"
      echo '{"ok":false,"error":{"code":"REMOTE_DISABLED","message":"desktop control disabled (/config/.agent-desktop/remote-disabled)"}}'
      exit 2
    fi
    echo "$(date +%FT%T) $caller $name" >> "$STATE/remote.log"
    pid=$(pgrep -u abc -x xfce4-session | head -1 || true)
    if [ -z "$pid" ]; then
      echo '{"ok":false,"error":{"code":"DESKTOP_DOWN","message":"no desktop session is running yet"}}'
      exit 2
    fi
    bus=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p')
    export HOME=/config DISPLAY=:1 DBUS_SESSION_BUS_ADDRESS="$bus"
    # Apps launched from here must join the accessibility bus at startup:
    # Gecko/GTK read GNOME_ACCESSIBILITY, Qt reads QT_ACCESSIBILITY.
    export GNOME_ACCESSIBILITY=1 QT_ACCESSIBILITY=1
    # Tell toolkits assistive tech is on (what GNOME does for a screen reader),
    # so browsers launched from here join the accessibility bus.
    dbus-send --session --dest=org.a11y.Bus /org/a11y/bus \
      org.freedesktop.DBus.Properties.Set string:org.a11y.Status \
      string:IsEnabled variant:boolean:true >/dev/null 2>&1 || true
    exec /usr/local/bin/agent-desktop "$@"

  adx-relay.py: |
    """Pod-local relay: lets agents in the app container drive this desktop.

    Binds 127.0.0.1 only, so just the containers of this pod can reach it.
    Every call is passed to adx-local (kill switch + audit) as an argv list.
    """
    import json
    import os
    import subprocess
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MAX_BODY = 1 << 20
    MAX_OUTPUT = 8 << 20
    SLOTS = threading.BoundedSemaphore(2)
    ENV = dict(os.environ, ADX_CALLER="pod-local")


    class Handler(BaseHTTPRequestHandler):
        timeout = 30

        def log_message(self, *args):
            pass

        def reply(self, status, payload):
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            if self.path != "/run":
                return self.reply(404, {"code": 2, "stderr": "not found"})
            length = int(self.headers.get("Content-Length", "0"))
            if length <= 0 or length > MAX_BODY:
                return self.reply(400, {"code": 2, "stderr": "bad body"})
            try:
                args = json.loads(self.rfile.read(length))["args"]
                if not isinstance(args, list) or not all(isinstance(a, str) for a in args):
                    raise ValueError
            except (ValueError, KeyError, TypeError):
                return self.reply(400, {"code": 2, "stderr": "args must be a list of strings"})
            if not SLOTS.acquire(timeout=60):
                return self.reply(429, {"code": 75, "stdout": "", "stderr": "relay busy, retry"})
            try:
                proc = subprocess.run(["/usr/local/bin/adx-local"] + args, capture_output=True,
                                      text=True, errors="replace", timeout=280, env=ENV)
                return self.reply(200, {"code": proc.returncode,
                                        "stdout": proc.stdout[:MAX_OUTPUT],
                                        "stderr": proc.stderr[:MAX_OUTPUT]})
            except subprocess.TimeoutExpired:
                return self.reply(200, {"code": 124, "stdout": "", "stderr": "agent-desktop timed out"})
            finally:
                SLOTS.release()


    ThreadingHTTPServer(("127.0.0.1", 7801), Handler).serve_forever()

  # Mounted into the app container as /usr/local/bin/adx-local, so the agents'
  # `adx local ...` reaches this pod's desktop.
  adx-local-client: |
    #!/usr/bin/env python3
    import json
    import sys
    import urllib.error
    import urllib.request

    req = urllib.request.Request(
        "http://127.0.0.1:7801/run",
        data=json.dumps({"args": sys.argv[1:]}).encode(),
        headers={"Content-Type": "application/json"},
    )
    try:
        with urllib.request.urlopen(req, timeout=300) as resp:
            result = json.loads(resp.read())
    except urllib.error.HTTPError as exc:
        result = json.loads(exc.read() or b"{}")
    except OSError as exc:
        print(json.dumps({"ok": False, "error": {"code": "DESKTOP_DOWN",
                                                 "message": f"desktop relay unreachable: {exc}"}}))
        sys.exit(2)
    sys.stdout.write(result.get("stdout", ""))
    sys.stderr.write(result.get("stderr", ""))
    sys.exit(int(result.get("code", 1)))
