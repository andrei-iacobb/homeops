---
# Shared by the alpha/beta/gamma desktop sidecars (linuxserver webtop, XFCE,
# streamed with Selkies at https://<worker>-desktop.iacob.uk behind Authentik).
# Agents drive the desktop with vercel-labs/agent-desktop through `adx`:
#   - inside the pod: `adx local ...` -> adx-local client -> relay on
#     127.0.0.1:7801 (pod loopback only) -> adx-local gate in the desktop
#   - from the Mac:   `adx alpha ...` -> kubectl exec -c desktop adx-local
# Kill switch: touch /config/.agent-desktop/remote-disabled in the desktop
# container. Audit log (caller + command name only): same dir, remote.log.
# Both are advisory: an agent driving the GUI can open the desktop's terminal
# (passwordless sudo) and undo them. Cut in-pod agents off with
#   kubectl -n code exec <w>-0 -c desktop -- s6-svc -d /run/service/custom-svc-adx-relay
# (also undoable from that terminal); the only absolute stop is removing the
# sidecar or scaling the worker to zero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: desktop-adx
data:
  # /custom-cont-init.d: runs as root before the desktop services start.
  50-adx-setup: |
    #!/bin/bash
    set -euo pipefail
    VER=1.0.2
    SHA=ad661b7a3fd8f990a769243f4889a240ca0e2c8dab3ef5bddd6019086c71e0b4
    DIR=/config/.adx/agent-desktop-$VER
    # Extract into a temporary sibling and rename only after the binary runs,
    # so an interrupted install can never leave a cached half-written binary.
    if ! "$DIR/agent-desktop" version >/dev/null 2>&1; then
      mkdir -p /config/.adx
      tmp=$(mktemp -d /config/.adx/.install.XXXXXX)
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL --retry 3 -o "$tmp/ad.tgz" \
        "https://github.com/vercel-labs/agent-desktop/releases/download/v$VER/agent-desktop-v$VER-x86_64-unknown-linux-gnu.tar.gz"
      echo "$SHA  $tmp/ad.tgz" | sha256sum -c -
      mkdir "$tmp/out"
      tar -xzf "$tmp/ad.tgz" -C "$tmp/out"
      "$tmp/out/agent-desktop" version >/dev/null
      rm -rf "$DIR"
      mv "$tmp/out" "$DIR"
      chown -R abc:abc /config/.adx
    fi
    ln -sf "$DIR/agent-desktop" /usr/local/bin/agent-desktop
    install -m 0755 /opt/adx/adx-local /usr/local/bin/adx-local
    install -m 0644 /opt/adx/adx-relay.py /usr/local/lib/adx-relay.py
    # Chromium needs this for page content on AT-SPI. Do not add
    # ACCESSIBILITY_ENABLED=1: it forces the legacy ATK bridge.
    printf '%s\n' \
      '# adx: expose page content on AT-SPI for agent-desktop' \
      'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --force-renderer-accessibility"' \
      '# Pods restart without closing the browser: no restore bubble or first run.' \
      'export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --hide-crash-restore-bubble --no-first-run"' \
      > /etc/chromium.d/zz-accessibility
    install -d -m 0700 -o abc -g abc /config/.agent-desktop
    echo "adx: agent-desktop $VER ready"
    # Firefox ESR is the browser agents type into: Chromium 156 (Debian)
    # segfaults in its AT-SPI bridge when Enter is pressed in the omnibox while
    # agent-desktop is attached. Lives in the container layer (~300M), so it is
    # reinstalled on each start; a failure here leaves the desktop usable.
    # Firefox policy: pod restarts kill the browser uncleanly, so skip the
    # crash-restore page, welcome tabs and nags that get in agents' way.
    # Upstream Firefox reads /etc/firefox/policies; also drop a copy in the
    # install's distribution dir (Debian's /etc/firefox-esr is not read).
    mkdir -p /etc/firefox/policies
    cat > /etc/firefox/policies/policies.json <<'EOF'
    {
      "policies": {
        "DisableAppUpdate": true,
        "DisableTelemetry": true,
        "DisableFirefoxStudies": true,
        "DisablePocket": true,
        "DontCheckDefaultBrowser": true,
        "NoDefaultBookmarks": true,
        "DisplayBookmarksToolbar": "never",
        "OverrideFirstRunPage": "",
        "OverridePostUpdatePage": "",
        "NewTabPage": false,
        "Homepage": {"StartPage": "none"},
        "FirefoxHome": {"Search": false, "TopSites": false, "SponsoredTopSites": false,
                        "Highlights": false, "Pocket": false, "SponsoredPocket": false,
                        "Stories": false, "SponsoredStories": false, "Snippets": false,
                        "Locked": true},
        "UserMessaging": {
          "WhatsNew": false,
          "ExtensionRecommendations": false,
          "FeatureRecommendations": false,
          "MoreFromMozilla": false,
          "SkipOnboarding": true
        },
        "Preferences": {
          "browser.sessionstore.resume_from_crash": {"Value": false, "Status": "default"},
          "browser.newtabpage.activity-stream.showWeather": {"Value": false, "Status": "default"}
        }
      }
    }
    EOF
    mkdir -p /usr/lib/firefox-esr/distribution
    if ! command -v firefox-esr >/dev/null; then
      ( apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
          apt-get install -y -qq --no-install-recommends firefox-esr ) >/dev/null 2>&1 \
        && echo "adx: firefox-esr installed" || echo "adx: WARNING firefox-esr install failed"
    fi
    [ -d /usr/lib/firefox-esr ] && \
      cp /etc/firefox/policies/policies.json /usr/lib/firefox-esr/distribution/policies.json

  # /custom-cont-init.d, after 50: desktop look (theme, panel, wallpaper).
  60-adx-look: |
    #!/bin/bash
    # Fleet desktop look: dark Greybird theme, one bottom panel with launchers,
    # readable title bars, per-worker wallpaper. Written once per LOOK version so
    # later tweaks made in the desktop survive restarts; bump LOOK to re-apply.
    set -euo pipefail
    LOOK=1
    WORKER=$(hostname | sed 's/-[0-9]*$//')
    mkdir -p /config/.adx
    [ -s /config/.adx/wallpaper.png ] || \
      /lsiopy/bin/python3 /opt/adx/adx-wallpaper.py /config/.adx/wallpaper.png "$WORKER"
    if [ "$(cat /config/.adx/look-version 2>/dev/null)" = "$LOOK" ]; then
      echo "adx: look v$LOOK already applied"; exit 0
    fi
    X=/config/.config/xfce4/xfconf/xfce-perchannel-xml
    P=/config/.config/xfce4/panel
    mkdir -p "$X"
    for n in 3 4 5 6; do mkdir -p "$P/launcher-$n"; done
    cp /usr/share/applications/firefox-esr.desktop "$P/launcher-3/" 2>/dev/null || true
    cp /usr/share/applications/chromium.desktop "$P/launcher-4/"
    cp /usr/share/applications/xfce4-terminal.desktop "$P/launcher-5/"
    cp /usr/share/applications/thunar.desktop "$P/launcher-6/"

    cat > "$X/xsettings.xml" <<'EOF'
    <?xml version="1.1" encoding="UTF-8"?>
    <channel name="xsettings" version="1.0">
      <property name="Net" type="empty">
        <property name="ThemeName" type="string" value="Greybird-dark"/>
        <property name="IconThemeName" type="string" value="elementary-xfce-dark"/>
      </property>
      <property name="Xft" type="empty">
        <property name="DPI" type="int" value="96"/>
        <property name="Antialias" type="int" value="1"/>
        <property name="Hinting" type="int" value="1"/>
        <property name="HintStyle" type="string" value="hintslight"/>
        <property name="RGBA" type="string" value="rgb"/>
      </property>
      <property name="Gtk" type="empty">
        <property name="FontName" type="string" value="Noto Sans 10"/>
        <property name="MonospaceFontName" type="string" value="Noto Sans Mono 10"/>
        <property name="CursorThemeName" type="string" value="Adwaita"/>
        <property name="CursorThemeSize" type="int" value="24"/>
        <property name="DecorationLayout" type="string" value="menu:minimize,maximize,close"/>
      </property>
    </channel>
    EOF

    cat > "$X/xfwm4.xml" <<'EOF'
    <?xml version="1.1" encoding="UTF-8"?>
    <channel name="xfwm4" version="1.0">
      <property name="general" type="empty">
        <property name="theme" type="string" value="Greybird-dark"/>
        <property name="title_font" type="string" value="Noto Sans Bold 10"/>
        <property name="title_alignment" type="string" value="center"/>
        <property name="button_layout" type="string" value="O|HMC"/>
        <property name="use_compositing" type="bool" value="false"/>
        <property name="workspace_count" type="int" value="1"/>
        <property name="placement_ratio" type="int" value="100"/>
      </property>
    </channel>
    EOF

    cat > "$X/xfce4-desktop.xml" <<EOF
    <?xml version="1.1" encoding="UTF-8"?>
    <channel name="xfce4-desktop" version="1.0">
      <property name="last-settings-migration-version" type="uint" value="1"/>
      <property name="desktop-icons" type="empty">
        <property name="style" type="int" value="0"/>
      </property>
      <property name="backdrop" type="empty">
        <property name="screen0" type="empty">
          <property name="monitorscreen" type="empty">
            <property name="workspace0" type="empty">
              <property name="last-image" type="string" value="/config/.adx/wallpaper.png"/>
              <property name="image-style" type="int" value="5"/>
              <property name="color-style" type="int" value="0"/>
              <property name="rgba1" type="array">
                <value type="double" value="0.055"/><value type="double" value="0.051"/>
                <value type="double" value="0.118"/><value type="double" value="1"/>
              </property>
            </property>
          </property>
        </property>
      </property>
    </channel>
    EOF

    cat > "$X/xfce4-panel.xml" <<'EOF'
    <?xml version="1.1" encoding="UTF-8"?>
    <channel name="xfce4-panel" version="1.0">
      <property name="configver" type="int" value="2"/>
      <property name="panels" type="array">
        <value type="int" value="1"/>
        <property name="dark-mode" type="bool" value="true"/>
        <property name="panel-1" type="empty">
          <property name="position" type="string" value="p=8;x=0;y=0"/>
          <property name="length" type="double" value="100"/>
          <property name="position-locked" type="bool" value="true"/>
          <property name="size" type="uint" value="40"/>
          <property name="icon-size" type="uint" value="24"/>
          <property name="plugin-ids" type="array">
            <value type="int" value="1"/><value type="int" value="2"/><value type="int" value="3"/>
            <value type="int" value="4"/><value type="int" value="5"/><value type="int" value="6"/>
            <value type="int" value="7"/><value type="int" value="8"/><value type="int" value="9"/>
            <value type="int" value="10"/><value type="int" value="11"/><value type="int" value="12"/>
          </property>
        </property>
      </property>
      <property name="plugins" type="empty">
        <property name="plugin-1" type="string" value="applicationsmenu">
          <property name="show-button-title" type="bool" value="false"/>
          <property name="button-icon" type="string" value="start-here"/>
        </property>
        <property name="plugin-2" type="string" value="separator">
          <property name="style" type="uint" value="0"/>
        </property>
        <property name="plugin-3" type="string" value="launcher">
          <property name="items" type="array"><value type="string" value="firefox-esr.desktop"/></property>
        </property>
        <property name="plugin-4" type="string" value="launcher">
          <property name="items" type="array"><value type="string" value="chromium.desktop"/></property>
        </property>
        <property name="plugin-5" type="string" value="launcher">
          <property name="items" type="array"><value type="string" value="xfce4-terminal.desktop"/></property>
        </property>
        <property name="plugin-6" type="string" value="launcher">
          <property name="items" type="array"><value type="string" value="thunar.desktop"/></property>
        </property>
        <property name="plugin-7" type="string" value="separator">
          <property name="style" type="uint" value="1"/>
        </property>
        <property name="plugin-8" type="string" value="tasklist">
          <property name="grouping" type="uint" value="1"/>
          <property name="flat-buttons" type="bool" value="true"/>
          <property name="show-handle" type="bool" value="false"/>
        </property>
        <property name="plugin-9" type="string" value="separator">
          <property name="expand" type="bool" value="true"/>
          <property name="style" type="uint" value="0"/>
        </property>
        <property name="plugin-10" type="string" value="systray">
          <property name="square-icons" type="bool" value="true"/>
        </property>
        <property name="plugin-11" type="string" value="separator">
          <property name="style" type="uint" value="0"/>
        </property>
        <property name="plugin-12" type="string" value="clock">
          <property name="mode" type="uint" value="2"/>
          <property name="digital-layout" type="uint" value="3"/>
          <property name="digital-time-format" type="string" value="%a %d %b   %H:%M"/>
        </property>
      </property>
    </channel>
    EOF
    chown -R abc:abc /config/.config/xfce4 /config/.adx
    echo "$LOOK" > /config/.adx/look-version
    echo "adx: look v$LOOK applied"

  # Generates the per-worker wallpaper (PIL from the Selkies venv).
  adx-wallpaper.py: |
    """Fleet desktop wallpaper: dark dusk gradient with soft layered dunes."""
    import math
    import sys

    from PIL import Image, ImageDraw, ImageFilter

    W, H = 2560, 1440
    out = sys.argv[1] if len(sys.argv) > 1 else "/config/.adx/wallpaper.png"
    label = sys.argv[2] if len(sys.argv) > 2 else ""


    def lerp(a, b, t):
        return tuple(round(a[i] + (b[i] - a[i]) * t) for i in range(3))


    # Sky: deep indigo at the top to a muted plum at the horizon.
    sky = Image.new("RGB", (1, H))
    stops = [(0.0, (14, 13, 30)), (0.55, (38, 24, 58)), (1.0, (86, 44, 74))]
    for y in range(H):
        t = y / (H - 1)
        for (t0, c0), (t1, c1) in zip(stops, stops[1:]):
            if t0 <= t <= t1:
                sky.putpixel((0, y), lerp(c0, c1, (t - t0) / (t1 - t0)))
    img = sky.resize((W, H))

    # Glow low on the horizon.
    glow = Image.new("L", (W, H), 0)
    ImageDraw.Draw(glow).ellipse((W * 0.18, H * 0.48, W * 0.82, H * 1.25), fill=120)
    glow = glow.filter(ImageFilter.GaussianBlur(220))
    img = Image.composite(Image.new("RGB", (W, H), (232, 120, 96)), img, glow)

    # Dunes: back to front, each a smooth curve, slightly blurred for depth.
    dunes = [
        (0.62, 70, 1.3, 0.4, (64, 34, 70), 6),
        (0.71, 60, 1.7, 2.1, (48, 26, 58), 4),
        (0.80, 52, 2.2, 4.0, (32, 19, 44), 2),
        (0.90, 40, 2.8, 1.2, (20, 13, 32), 0),
    ]
    for base, amp, freq, phase, color, blur in dunes:
        mask = Image.new("L", (W, H), 0)
        pts = [(x, H * base + amp * math.sin(freq * x / W * math.tau + phase)
                + amp * 0.35 * math.sin(3.1 * freq * x / W * math.tau + phase * 1.7))
               for x in range(0, W + 8, 8)]
        ImageDraw.Draw(mask).polygon(pts + [(W, H), (0, H)], fill=255)
        if blur:  # blur the mask only, so edges fade without a dark fringe
            mask = mask.filter(ImageFilter.GaussianBlur(blur))
        img = Image.composite(Image.new("RGB", (W, H), color), img, mask)

    if label:
        # Top right, inset past the crop of narrower-than-16:9 screens.
        ImageDraw.Draw(img).text((W - 240, 110), label, fill=(150, 120, 160), anchor="ra",
                                 font_size=40)
    img.save(out, optimize=True)

  # /custom-services.d: s6 longrun, the pod-local relay.
  adx-relay: |
    #!/usr/bin/with-contenv bash
    exec s6-setuidgid abc "$(command -v python3)" /usr/local/lib/adx-relay.py

  # Desktop-side gate. Every path into this desktop goes through here.
  adx-local: |
    #!/bin/bash
    set -euo pipefail
    STATE=/config/.agent-desktop
    CALLER=${ADX_CALLER:-kubectl-exec}
    if [ "$(id -u)" = 0 ]; then
      exec s6-setuidgid abc env ADX_CALLER="$CALLER" "$0" "$@"
    fi
    mkdir -p "$STATE"
    # Log the command name: the first argument that is not a global flag.
    cmd=""; for a in "$@"; do case $a in -*) ;; *) cmd=$a; break;; esac; done
    name=$(printf '%s' "${cmd:-${1:-}}" | head -c 40 | tr -c 'A-Za-z0-9._-' '?')
    caller=$(printf '%s' "$CALLER" | head -c 40 | tr -c 'A-Za-z0-9._-' '?')
    if [ -e "$STATE/remote-disabled" ]; then
      echo "$(date +%FT%T) $caller DENIED $name" >> "$STATE/remote.log"
      echo '{"ok":false,"error":{"code":"REMOTE_DISABLED","message":"desktop control disabled (/config/.agent-desktop/remote-disabled)"}}'
      exit 2
    fi
    echo "$(date +%FT%T) $caller $name" >> "$STATE/remote.log"
    pid=$(pgrep -u abc -x xfce4-session | head -1 || true)
    if [ -z "$pid" ]; then
      echo '{"ok":false,"error":{"code":"DESKTOP_DOWN","message":"no desktop session is running yet"}}'
      exit 2
    fi
    bus=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DBUS_SESSION_BUS_ADDRESS=//p')
    export HOME=/config DISPLAY=:1 DBUS_SESSION_BUS_ADDRESS="$bus"
    # Apps launched from here must join the accessibility bus at startup:
    # Gecko/GTK read GNOME_ACCESSIBILITY, Qt reads QT_ACCESSIBILITY.
    export GNOME_ACCESSIBILITY=1 QT_ACCESSIBILITY=1
    # Tell toolkits assistive tech is on (what GNOME does for a screen reader),
    # so browsers launched from here join the accessibility bus.
    dbus-send --session --dest=org.a11y.Bus /org/a11y/bus \
      org.freedesktop.DBus.Properties.Set string:org.a11y.Status \
      string:IsEnabled variant:boolean:true >/dev/null 2>&1 || true
    exec /usr/local/bin/agent-desktop "$@"

  adx-relay.py: |
    """Pod-local relay: lets agents in the app container drive this desktop.

    Binds 127.0.0.1 only, so just the containers of this pod can reach it.
    Every call is passed to adx-local (kill switch + audit) as an argv list.
    """
    import json
    import os
    import subprocess
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MAX_BODY = 1 << 20
    MAX_OUTPUT = 8 << 20
    SLOTS = threading.BoundedSemaphore(2)
    ENV = dict(os.environ, ADX_CALLER="pod-local")


    class Handler(BaseHTTPRequestHandler):
        timeout = 30

        def log_message(self, *args):
            pass

        def reply(self, status, payload):
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            if self.path != "/run":
                return self.reply(404, {"code": 2, "stderr": "not found"})
            length = int(self.headers.get("Content-Length", "0"))
            if length <= 0 or length > MAX_BODY:
                return self.reply(400, {"code": 2, "stderr": "bad body"})
            try:
                args = json.loads(self.rfile.read(length))["args"]
                if not isinstance(args, list) or not all(isinstance(a, str) for a in args):
                    raise ValueError
            except (ValueError, KeyError, TypeError):
                return self.reply(400, {"code": 2, "stderr": "args must be a list of strings"})
            if not SLOTS.acquire(timeout=60):
                return self.reply(429, {"code": 75, "stdout": "", "stderr": "relay busy, retry"})
            try:
                proc = subprocess.run(["/usr/local/bin/adx-local"] + args, capture_output=True,
                                      text=True, errors="replace", timeout=280, env=ENV)
                return self.reply(200, {"code": proc.returncode,
                                        "stdout": proc.stdout[:MAX_OUTPUT],
                                        "stderr": proc.stderr[:MAX_OUTPUT]})
            except subprocess.TimeoutExpired:
                return self.reply(200, {"code": 124, "stdout": "", "stderr": "agent-desktop timed out"})
            finally:
                SLOTS.release()


    ThreadingHTTPServer(("127.0.0.1", 7801), Handler).serve_forever()

  # Mounted into the app container as /usr/local/bin/adx-local, so the agents'
  # `adx local ...` reaches this pod's desktop.
  adx-local-client: |
    #!/usr/bin/env python3
    import json
    import sys
    import urllib.error
    import urllib.request

    req = urllib.request.Request(
        "http://127.0.0.1:7801/run",
        data=json.dumps({"args": sys.argv[1:]}).encode(),
        headers={"Content-Type": "application/json"},
    )
    try:
        with urllib.request.urlopen(req, timeout=300) as resp:
            result = json.loads(resp.read())
    except urllib.error.HTTPError as exc:
        result = json.loads(exc.read() or b"{}")
    except OSError as exc:
        print(json.dumps({"ok": False, "error": {"code": "DESKTOP_DOWN",
                                                 "message": f"desktop relay unreachable: {exc}"}}))
        sys.exit(2)
    sys.stdout.write(result.get("stdout", ""))
    sys.stderr.write(result.get("stderr", ""))
    sys.exit(int(result.get("code", 1)))
