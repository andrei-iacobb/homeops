---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gamma
  namespace: code
spec:
  targetNamespace: code
  commonMetadata:
    labels:
      app.kubernetes.io/name: gamma
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/apps/code/gamma/app
  postBuild:
    substitute:
      APP: gamma
      APP_PVC: gamma-home
      VOLSYNC_SCHEDULE: "30 3 * * *"
      MOVER_UID: "1000"
      MOVER_GID: "1000"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: volsync-secret
        kind: Secret
