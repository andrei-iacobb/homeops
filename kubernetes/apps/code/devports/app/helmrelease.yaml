---
# devports - reach a dev server running inside a T3 worker from a browser:
#   https://<port>-<worker>.iacob.uk  ->  <worker>-0:<port>
# e.g. `next dev -p 3400` on beta is https://3400-beta.iacob.uk. Internal
# gateway only (home network / WireGuard), behind the gateway-wide Authentik
# SSO. One label under iacob.uk, so the existing *.iacob.uk certificate
# covers it. The route is a wildcard: exact hostnames on envoy-internal win,
# and nginx answers 404 for any other name that falls through to it.
# Routing lives in nginx.conf; workers.yaml points at each worker pod.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devports
spec:
  chartRef:
    kind: OCIRepository
    name: devports
  interval: 1h
  values:
    controllers:
      devports:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["*.iacob.uk"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: devports-nginx
        globalMounts:
          - path: /etc/nginx/conf.d
            readOnly: true
      # nginx-unprivileged keeps its pid and temp files under /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
