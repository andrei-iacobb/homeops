# https://<port>-<worker>.iacob.uk -> <worker>-0:<port>
# Whatever an agent serves on that port inside alpha, beta or gamma (it must
# listen on 0.0.0.0, not 127.0.0.1). 3000/3001 are the webtop desktop, which
# has no auth and a sudo terminal: refused here and by code-desktop-deny.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

# next dev refuses /_next requests whose Origin is not localhost or listed in
# allowedDevOrigins (HMR socket, dev overlay). They are same-origin here, so
# drop Origin on those paths rather than edit every project's config.
map $uri $dev_origin {
  ~^/_next/ "";
  default $http_origin;
}

server {
  listen 8080 default_server;
  server_name _;
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
  location / {
    return 404 "use https://<port>-<alpha|beta|gamma>.iacob.uk\n";
  }
}

server {
  listen 8080;
  server_name "~^(?<devport>[1-9][0-9]{3,4})-(?<worker>alpha|beta|gamma)\.iacob\.uk$";

  resolver 10.41.0.10 valid=10s ipv6=off;
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Origin $dev_origin;

  if ($devport ~ "^300[01]$") {
    return 403 "the desktop is at https://<worker>-desktop.iacob.uk\n";
  }

  location / {
    proxy_pass http://$worker-devports.code.svc.cluster.local:$devport;
  }
}
