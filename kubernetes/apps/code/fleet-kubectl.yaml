---
# Cluster access for the agents on alpha/beta/gamma, so cluster work runs with
# kubectl/flux/helm inside the worker instead of hopping to the Mac.
# The workers do not mount this account. Each one holds a kubeconfig at
# /home/t3/.kube/config (on its home PVC) built from the token below.
# This is cluster-admin: anything running on a worker can read and change
# everything in the cluster. To cut it off, delete the Secret (the token dies
# with it); to narrow it, point the binding at `view` or a custom role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-kubectl
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: fleet-kubectl-token
  annotations:
    kubernetes.io/service-account.name: fleet-kubectl
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: fleet-kubectl
    namespace: code
