---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
data:
  config.yaml: |
    # Public URL: nodes register and poll the control plane from anywhere
    # (CF tunnel -> envoy-external). Data plane is direct/DERP, not via CF.
    server_url: https://headscale.iacob.co.uk
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    private_key_path: /data/private.key
    noise:
      private_key_path: /data/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    database:
      type: sqlite
      sqlite:
        path: /data/db.sqlite
    dns:
      base_domain: ts.iacob.uk
      magic_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 8.8.8.8
        # LAN names (*.iacob.uk -> envoy-internal etc.) resolve via the AdGuards,
        # reachable through the tailscale-router subnet route.
        split:
          iacob.uk:
            - 192.168.1.120
            - 192.168.1.125
    derp:
      urls:
        - https://controlplane.tailscale.com/derpmap/default
      auto_update_enabled: true
      update_frequency: 24h
    log:
      level: info
