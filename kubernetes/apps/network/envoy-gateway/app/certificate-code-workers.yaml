---
# *.iacob.uk covers one label only; dev servers in the T3 workers are served
# one level down, as <port>.<worker>.iacob.uk (code/devports).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: code-workers-production
spec:
  secretName: code-workers-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.beta.iacob.uk"
  dnsNames: ["*.alpha.iacob.uk", "*.beta.iacob.uk", "*.gamma.iacob.uk"]
