---
# Subnet router for the headscale tailnet. Joins headscale as "cluster-router"
# and advertises the LAN, so tailnet devices (Mac, phone) reach envoy-internal
# and the *.iacob.uk apps (the T3 Code fleet in particular) without a public
# route. Forwarding needs kernel tailscale + ip_forward, hence privileged and
# /dev/net/tun. Node state lives on the PVC so the pre-auth key is used once.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-router
spec:
  chartRef:
    kind: OCIRepository
    name: tailscale-router
  interval: 1h
  values:
    controllers:
      tailscale-router:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.33.158
            env:
              TZ: Europe/London
              TS_HOSTNAME: cluster-router
              TS_STATE_DIR: /var/lib/tailscale
              TS_USERSPACE: "false"
              TS_ROUTES: 192.168.1.0/24
              TS_ACCEPT_DNS: "false"
              TS_EXTRA_ARGS: --login-server=https://headscale.iacob.co.uk
              # Prevent containerboot from storing state in a k8s Secret.
              TS_KUBE_SECRET: ""
              TS_ENABLE_HEALTH_CHECK: "true"
              TS_HEALTHCHECK_ADDR_PORT: 0.0.0.0:9002
            envFrom:
              - secretRef:
                  name: tailscale-router-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9002
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9002
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        ports:
          health:
            port: 9002
    persistence:
      state:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        size: 1Gi
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/lib/tailscale
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
