---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      version: "93.2.2"
  releaseName: prometheus
  interval: 1h
  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 14d
        # Alloy (OpenTelemetry app metrics) and Tempo's metrics generator push here.
        enableRemoteWriteReceiver: true
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        # Restrict to monitoring namespace only; Prometheus SA lacks RBAC elsewhere (causes 500)
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          # Default: everything goes to Hermes for triage. Hermes classifies the
          # alert light vs heavy, auto-fixes the light ones, and only pings
          # Discord for the ones that actually need Andrei.
          receiver: "hermes-triage"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - severity="info"
              receiver: "null"
            - matchers:
                - alertname="InfoInhibitor"
              receiver: "null"
            - matchers:
                - alertname="Watchdog"
              receiver: "null"
            - matchers:
                - severity="critical"
              receiver: "hermes-triage"
              repeat_interval: 1h
        receivers:
          - name: "null"
          - name: "hermes-triage"
            webhook_configs:
              # Hermes Agent webhook gateway on the hermes-agent VM (192.168.1.73).
              # Authenticated with a shared token; Hermes' webhook adapter accepts
              # it via the X-Gitlab-Token scheme (a plain constant-time compare),
              # which is the only scheme Alertmanager can satisfy - it cannot HMAC
              # its own body. Token is mounted from the alertmanager-hermes-webhook
              # secret, never inlined here.
              - url: "http://192.168.1.73:8644/webhooks/alertmanager"
                send_resolved: false
                http_config:
                  http_headers:
                    X-Gitlab-Token:
                      files:
                        - /etc/alertmanager/secrets/alertmanager-hermes-webhook/token
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: ["alertname", "namespace"]
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-hermes-webhook/token
        # and read by the hermes-triage receiver's X-Gitlab-Token header.
        secrets:
          - alertmanager-hermes-webhook
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    grafana:
      enabled: true
      defaultDashboardsEnabled: false
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      env:
        GF_PLUGINS_PREINSTALL_SYNC: "grafana-opensearch-datasource@2.34.6,grafana-clickhouse-datasource@4.23.2,grafana-github-datasource@2.9.4"
        GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /tmp/dashboards/everything.json
        GF_SECURITY_ALLOW_EMBEDDING: "true"
        GF_SECURITY_COOKIE_SAMESITE: "none"
        GF_SECURITY_COOKIE_SECURE: "true"
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
        GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
        # Signed in by Authentik forward auth (headers can only come from it,
        # see the ClientTrafficPolicy in network/envoy-gateway).
        GF_AUTH_PROXY_ENABLED: "true"
        GF_AUTH_PROXY_HEADER_NAME: X-authentik-username
        GF_AUTH_PROXY_HEADER_PROPERTY: username
        GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
        GF_AUTH_PROXY_HEADERS: "Email:X-authentik-email Name:X-authentik-name"
        GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      deleteDatasources:
        - name: prometheus
          orgId: 1
      additionalDataSources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          editable: true
          jsonData:
            derivedFields:
              - name: TraceID
                matcherType: regex
                matcherRegex: '(?:trace_id|traceID|otelTraceID)[=:" ]+(\w{32})'
                url: '${__value.raw}'
                datasourceUid: tempo
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          isDefault: false
          editable: false
          jsonData:
            serviceMap:
              datasourceUid: prometheus
            nodeGraph:
              enabled: true
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: -5m
              spanEndTimeShift: 5m
              filterByTraceID: true
              customQuery: true
              query: '{namespace="${__span.tags["k8s.namespace.name"]}"} |= "${__trace.traceId}"'
            tracesToMetrics:
              datasourceUid: prometheus
            search:
              hide: false
      # One SQLite DB on a RWO volume: a rolling update starts the new pod while
      # the old one still holds it, the new one crash-loops and Helm times out.
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: openebs-hostpath
        size: 10Gi
      initChownData:
        enabled: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: monitoring
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        datasources:
          enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
