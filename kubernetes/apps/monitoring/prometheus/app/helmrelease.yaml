---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      version: "87.21.0"
  releaseName: prometheus
  interval: 1h
  values:
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 14d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        # Restrict to monitoring namespace only; Prometheus SA lacks RBAC elsewhere (causes 500)
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          # Default: everything goes to Hermes for triage. Hermes classifies the
          # alert light vs heavy, auto-fixes the light ones, and only pings
          # Discord for the ones that actually need Andrei.
          receiver: "hermes-triage"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - severity="info"
              receiver: "null"
            - matchers:
                - alertname="InfoInhibitor"
              receiver: "null"
            - matchers:
                - alertname="Watchdog"
              receiver: "null"
            # Criticals are deliberately fanned out to BOTH paths: straight to
            # Discord (continue: true) so a broken or unreachable triage pipeline
            # can never silently swallow a critical alert, and then on to Hermes
            # for triage. Warnings - the crash-loop/OOM noise - go to Hermes only.
            - matchers:
                - severity="critical"
              receiver: "n8n-webhook"
              repeat_interval: 1h
              continue: true
            - matchers:
                - severity="critical"
              receiver: "hermes-triage"
              repeat_interval: 1h
        receivers:
          - name: "null"
          - name: "hermes-triage"
            webhook_configs:
              # Hermes Agent webhook gateway on the hermes-agent VM (192.168.1.73).
              # Authenticated with a shared token; Hermes' webhook adapter accepts
              # it via the X-Gitlab-Token scheme (a plain constant-time compare),
              # which is the only scheme Alertmanager can satisfy - it cannot HMAC
              # its own body. Token is mounted from the alertmanager-hermes-webhook
              # secret, never inlined here.
              - url: "http://192.168.1.73:8644/webhooks/alertmanager"
                send_resolved: false
                http_config:
                  http_headers:
                    X-Gitlab-Token:
                      files:
                        - /etc/alertmanager/secrets/alertmanager-hermes-webhook/token
          - name: "n8n-webhook"
            webhook_configs:
              # n8n workflow -> Discord. Now only used for critical alerts, as the
              # always-delivered safety net behind Hermes triage.
              - url: "http://n8n.default.svc.cluster.local:5678/webhook/alertmanager"
                send_resolved: true
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: ["alertname", "namespace"]
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-hermes-webhook/token
        # and read by the hermes-triage receiver's X-Gitlab-Token header.
        secrets:
          - alertmanager-hermes-webhook
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      env:
        GF_SECURITY_ALLOW_EMBEDDING: "true"
        GF_SECURITY_COOKIE_SAMESITE: "none"
        GF_SECURITY_COOKIE_SECURE: "true"
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
        GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          editable: true
      persistence:
        enabled: true
        storageClassName: openebs-hostpath
        size: 10Gi
      initChownData:
        enabled: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: monitoring
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        datasources:
          enabled: false
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          kubernetes-views-pods:
            gnetId: 15760
            revision: 40
            datasource: Prometheus
          kubernetes-views-global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    prometheusOperator:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
