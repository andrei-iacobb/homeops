            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (node, condition) (kube_node_status_condition{status=\"true\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
