                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "No",
                            "color": "red"
                          },
                          "1": {
                            "text": "Yes",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*Pressure|NetworkUnavailable"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "No",
                            "color": "green"
                          },
                          "1": {
                            "text": "Yes",
                            "color": "red"
                          }
                        }
                      }
                    ]
