---
apiVersion: v1
kind: ConfigMap
metadata:
  name: everything-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  everything.json: |
    {
      "uid": "everything",
      "title": "Everything",
      "description": "One screen for the whole stack: alerts, cluster and app logs, proxy, servers, storage forecasts, network, Home Assistant, Wazuh security, Microsoft 365 and Plausible analytics.",
      "tags": [
        "overview",
        "home"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "schemaVersion": 41,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "Wazuh",
          "type": "link",
          "url": "https://wazuh.iacob.uk",
          "targetBlank": true,
          "icon": "shield"
        },
        {
          "title": "Plausible",
          "type": "link",
          "url": "https://plausible.iacob.co.uk",
          "targetBlank": true,
          "icon": "external link"
        },
        {
          "title": "Explore logs",
          "type": "link",
          "url": "/explore?left=%7B%22datasource%22:%22loki%22%7D",
          "icon": "search"
        },
        {
          "title": "Other dashboards",
          "type": "dashboards",
          "tags": [],
          "asDropdown": true,
          "includeVars": false
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "namespace",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "",
              "type": 1
            },
            "definition": "label_values(namespace)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "repo",
            "label": "GitHub repo",
            "type": "query",
            "datasource": {
              "type": "grafana-github-datasource",
              "uid": "github"
            },
            "query": {
              "refId": "repo",
              "queryType": "Repositories",
              "owner": "andrei-iacobb",
              "options": {},
              "key": "name",
              "field": "name"
            },
            "current": {
              "text": "homeops",
              "value": "homeops"
            },
            "refresh": 1,
            "sort": 1
          },
          {
            "name": "site",
            "label": "Site",
            "type": "custom",
            "multi": true,
            "includeAll": true,
            "query": "iacob.co.uk : 1, neatplan.app : 2, visitor.local (Chassis Sign) : 3, holden.systems : 4",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "At a glance",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Critical alerts",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\"}) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Prometheus alerts firing with severity=critical."
        },
        {
          "type": "stat",
          "title": "Warnings",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"warning\"}) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Targets down",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up == 0) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Scrape targets Prometheus cannot reach. Syncthing on the Arch PC is expected while the PC is off."
        },
        {
          "type": "stat",
          "title": "Pods not ready",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_pod_status_ready{condition=\"false\"} == 1 unless on(pod,namespace) kube_pod_status_phase{phase=\"Succeeded\"} == 1) or vector(0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Security alerts",
          "id": 6,
          "datasource": {
            "type": "grafana-opensearch-datasource",
            "uid": "wazuh-demo"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-opensearch-datasource",
                "uid": "wazuh-demo"
              },
              "query": "rule.level:>=7",
              "queryType": "lucene",
              "alias": "",
              "metrics": [
                {
                  "id": "1",
                  "type": "count"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "date_histogram",
                  "field": "timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0"
                  }
                }
              ],
              "timeField": "timestamp"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "sum"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Wazuh alerts at level 7 or above in the selected range. Open Wazuh for the full investigation view.",
          "links": [
            {
              "title": "Open Wazuh",
              "url": "https://wazuh.iacob.uk",
              "targetBlank": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Next volume full",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "min(homelab:volume_days_until_full > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  },
                  {
                    "color": "green",
                    "value": 14
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "description": "Shortest forecast, in days, before any node disk, PVC, TrueNAS pool or Proxmox storage fills at its current rate."
        },
        {
          "type": "stat",
          "title": "Visitors today",
          "id": 8,
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "plausible"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "plausible"
              },
              "editorType": "sql",
              "format": 1,
              "rawSql": "SELECT uniq(user_id) FROM events_v2 WHERE timestamp >= toStartOfDay(now()) AND site_id IN (${site:csv})",
              "queryType": "table"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Unique visitors across the selected Plausible sites since midnight UTC.",
          "links": [
            {
              "title": "Open Plausible",
              "url": "https://plausible.iacob.co.uk",
              "targetBlank": true
            }
          ]
        },
        {
          "type": "stat",
          "title": "Proxy req/s",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~\"httproute/.*\"}[5m]))",
              "legendFormat": "",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Alerts and incidents",
          "id": 10,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Firing alerts (Prometheus)",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "description": "Everything Alertmanager is currently routing to Hermes.",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "alertstate": true,
                  "container": true,
                  "endpoint": true,
                  "job": true,
                  "prometheus": true,
                  "service": true,
                  "uid": true,
                  "pod": true
                },
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "namespace": 2,
                  "instance": 3
                }
              }
            }
          ]
        },
        {
          "type": "table",
          "title": "High-severity security events (Wazuh)",
          "id": 12,
          "datasource": {
            "type": "grafana-opensearch-datasource",
            "uid": "wazuh-demo"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-opensearch-datasource",
                "uid": "wazuh-demo"
              },
              "query": "rule.level:>=7",
              "queryType": "lucene",
              "metrics": [
                {
                  "id": "1",
                  "type": "raw_data",
                  "settings": {
                    "size": "50"
                  }
                }
              ],
              "bucketAggs": [],
              "timeField": "timestamp"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "includeByName": {
                  "timestamp": true,
                  "rule.level": true,
                  "rule.description": true,
                  "agent.name": true,
                  "location": true
                },
                "indexByName": {
                  "timestamp": 0,
                  "rule.level": 1,
                  "rule.description": 2,
                  "agent.name": 3,
                  "location": 4
                }
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "Cluster and apps",
          "id": 13,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU by namespace",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace)(rate(container_cpu_usage_seconds_total{container!=\"\",namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Memory by namespace",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace)(container_memory_working_set_bytes{container!=\"\",namespace=~\"$namespace\"})",
              "legendFormat": "{{namespace}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Container restarts (1h)",
          "id": 16,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, pod)(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) > 0",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Error log lines by app",
          "id": 17,
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (namespace, app) (count_over_time({namespace=~\"$namespace\"} |~ `(?i)(error|exception|fatal|panic|traceback|level=crit)` [5m]))",
              "legendFormat": "{{namespace}}/{{app}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1,
