apiVersion: v1
kind: Service
metadata:
  name: loki-home-ingest
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    nodePort: 30100
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-home-ingest
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
  - fromEntities:
    - cluster
    - host
  - fromCIDR:
    - 192.168.1.90/32
    - 192.168.1.100/32
    - 192.168.1.150/32
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
