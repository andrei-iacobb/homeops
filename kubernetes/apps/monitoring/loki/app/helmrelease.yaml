apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.7.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      image:
        registry: docker.io
        repository: grafana/loki
        tag: 3.7.11
      commonConfig:
        path_prefix: /var/loki
        replication_factor: 1
      schemaConfig:
        configs:
        - from: '2024-04-01'
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
      storage:
        type: filesystem
      # Single binary defaults to 4 concurrent sub-queries, so dashboards queued
      # for minutes. The node has plenty of idle cores.
      querier:
        max_concurrent: 16
      # Cache query results in memory so a 1m dashboard refresh only computes
      # the newest split instead of the whole range again.
      structuredConfig:
        query_range:
          cache_results: true
          results_cache:
            cache:
              embedded_cache:
                enabled: true
                max_size_mb: 256
                ttl: 24h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 0s
        # Fewer, larger sub-queries: a 24h panel was splitting into ~100.
        split_queries_by_interval: 1h
        max_query_parallelism: 32
        retention_stream:
        - selector: '{namespace=~"homeassistant|proxmox"}'
          priority: 1
          period: 168h
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 50Gi
    backend:
      replicas: 0
    write:
      replicas: 0
    read:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      # Single node: the chart's required pod anti-affinity leaves the new
      # gateway pod Pending on every image change, so a rollout never finishes.
      affinity: null
      image:
        # Docker Hub nginxinc/nginx-unprivileged stopped updating in Oct 2026;
        # upstream publishes to ghcr.io/nginx now.
        registry: ghcr.io
        repository: nginx/nginx-unprivileged
        tag: 1.31.10-alpine
    sidecar:
      image:
        registry: ghcr.io
        repository: andrei-iacobb/patched/k8s-sidecar
        tag: 2.14.3-p20261128@sha256:ad22df89ab1b27e7eec3ff565d04330018140e7b68a9faf7dec4f2d3f388f286
    test:
      enabled: false
