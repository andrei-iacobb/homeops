---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/otel-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  wait: true
---
# Instrumentation CRs need the operator's CRDs and webhook first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-instrumentation
spec:
  dependsOn:
    - name: otel-operator
  interval: 1h
  path: ./kubernetes/apps/monitoring/otel-operator/instrumentation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
