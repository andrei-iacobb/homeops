---
# Injects the OpenTelemetry SDK into annotated pods at admission time
# (instrumentation.opentelemetry.io/inject-<lang>), so self-built apps get
# traces and metrics without code changes. The pod webhook fails open: if the
# operator is down, pods still start, just uninstrumented.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.126.2
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    manager:
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
      pods:
        failurePolicy: Ignore
