---
# SDK settings for auto-instrumented pods in monitoring. Telemetry goes to Alloy,
# which fans out to Tempo (traces), Prometheus (metrics) and Loki (logs).
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default
  namespace: monitoring
spec:
  exporter:
    endpoint: http://alloy.monitoring.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on
  resource:
    addK8sUIDAttributes: false
  env:
    # stdout is already shipped to Loki by Alloy; OTLP logs would duplicate it.
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "30000"
    # Stable HTTP semantic conventions only: metrics are labelled by host and
    # route, not full URL, which keeps series counts bounded.
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: http
  nodejs:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      # fs and dns spans are noise for web apps.
      - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
        value: fs,dns,net
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
      # Per-core host CPU metrics duplicate cAdvisor and multiply series.
      - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
        value: system_metrics
