---
# SDK settings for auto-instrumented pods in default. Telemetry goes to Alloy,
# which fans out to Tempo (traces), Prometheus (metrics) and Loki (logs).
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default
  namespace: default
spec:
  exporter:
    endpoint: http://alloy.monitoring.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_always_on
  resource:
    addK8sUIDAttributes: false
  env:
    # stdout is already shipped to Loki by Alloy; OTLP logs would duplicate it.
    - name: OTEL_LOGS_EXPORTER
      value: none
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "30000"
  nodejs:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      # fs and dns spans are noise for web apps.
      - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
        value: fs,dns,net
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
