---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilo-exporter-dl380
  labels:
    app: ilo-exporter-dl380
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ilo-exporter-dl380
  template:
    metadata:
      labels:
        app: ilo-exporter-dl380
    spec:
      containers:
      - name: exporter
        image: ghcr.io/mauvesoftware/ilo_exporter:1.1.3@sha256:2d5ce57969180bb9332d9df1257b7fe22ff14f4f1ad54d8ba9e8b908b5c83e90
        env:
        - name: API_USERNAME
          valueFrom:
            secretKeyRef:
              name: ilo-dl380-secret
              key: ILO_USER
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilo-dl380-secret
              key: ILO_PASSWORD
        ports:
        - name: metrics
          containerPort: 9545
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
