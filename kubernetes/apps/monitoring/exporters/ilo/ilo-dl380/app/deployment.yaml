---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilo-exporter-dl380
  labels:
    app: ilo-exporter-dl380
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ilo-exporter-dl380
  template:
    metadata:
      labels:
        app: ilo-exporter-dl380
    spec:
      containers:
      - name: exporter
        image: ghcr.io/mauvesoftware/ilo_exporter:1.2.0@sha256:545d89df8a511bcd6f0d3f1ad6cbb10feb4e9674af41fe1165cf1cece8e2df34
        env:
        - name: API_USERNAME
          valueFrom:
            secretKeyRef:
              name: ilo-dl380-secret
              key: ILO_USER
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilo-dl380-secret
              key: ILO_PASSWORD
        ports:
        - name: metrics
          containerPort: 9545
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
