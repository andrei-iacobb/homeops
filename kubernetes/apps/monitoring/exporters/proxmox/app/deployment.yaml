---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxmox-exporter
  annotations:
    # These credential placeholders belong to the container shell, not Flux.
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    app: proxmox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxmox-exporter
  template:
    metadata:
      labels:
        app: proxmox-exporter
    spec:
      containers:
      - name: exporter
        image: prompve/prometheus-pve-exporter:3.11.0@sha256:290756c34fd13e1d9972b8e64344d49a15ab99dd0053b29d9716f1ca4ae4c069
        env:
        - name: PROXMOX_HOST
          valueFrom:
            secretKeyRef:
              name: proxmox-secret
              key: PROXMOX_HOST
        - name: PROXMOX_USER
          valueFrom:
            secretKeyRef:
              name: proxmox-secret
              key: PROXMOX_USER
        - name: PROXMOX_PASSWORD
          valueFrom:
            secretKeyRef:
              name: proxmox-secret
              key: PROXMOX_PASSWORD
        command:
          - /bin/sh
          - -c
          - |
            cat > /tmp/pve.yml <<EOF
            default:
              user: "${PROXMOX_USER}"
              password: "${PROXMOX_PASSWORD}"
              verify_ssl: false
            EOF
            exec pve_exporter --config.file=/tmp/pve.yml --web.listen-address=:9221
        ports:
        - name: metrics
          containerPort: 9221
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
