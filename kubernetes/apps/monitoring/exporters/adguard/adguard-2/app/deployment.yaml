---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-exporter-2
  labels:
    app: adguard-exporter-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-exporter-2
  template:
    metadata:
      labels:
        app: adguard-exporter-2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: exporter
        # henrywhitaker3/adguard-exporter replaced ebrianne/adguard-exporter
        # (a dead Go 1.15 build that 404s against AdGuard Home 1.0). Metric
        # names differ: adguard_queries, adguard_queries_blocked,
        # adguard_avg_processing_time_seconds, label "server" not "hostname".
        image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.3@sha256:27244b698034a190d657417fe1231db02cf2d22931d238495fd1a32bd0957185
        env:
        - name: ADGUARD_IP
          valueFrom:
            secretKeyRef:
              name: adguard-2-secret
              key: ADGUARD_IP
        - name: ADGUARD_SERVERS
          value: "http://$(ADGUARD_IP)"
        - name: ADGUARD_USERNAMES
          valueFrom:
            secretKeyRef:
              name: adguard-2-secret
              key: ADGUARD_USER
        - name: ADGUARD_PASSWORDS
          valueFrom:
            secretKeyRef:
              name: adguard-2-secret
              key: ADGUARD_PASSWORD
        - name: INTERVAL
          value: "30s"
        ports:
        - name: metrics
          containerPort: 9618
        readinessProbe:
          tcpSocket:
            port: metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
