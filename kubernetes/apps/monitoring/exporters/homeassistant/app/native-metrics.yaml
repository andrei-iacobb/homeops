apiVersion: v1
kind: Service
metadata:
  name: homeassistant-native
  labels:
    app: homeassistant-native
spec:
  ports:
  - name: http
    port: 8123
    targetPort: 8123
---
apiVersion: v1
kind: Endpoints
metadata:
  name: homeassistant-native
subsets:
- addresses:
  - ip: 192.168.1.90
  ports:
  - name: http
    port: 8123
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: homeassistant-native
spec:
  selector:
    matchLabels:
      app: homeassistant-native
  endpoints:
  - port: http
    path: /api/prometheus
    interval: 60s
    scrapeTimeout: 30s
    authorization:
      type: Bearer
      credentials:
        name: homeassistant-metrics-secret
        key: HASS_TOKEN
