apiVersion: v1
kind: Service
metadata:
  name: homeassistant-native
  labels:
    app: homeassistant-native
spec:
  ports:
  - name: http
    port: 8123
    targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homeassistant-native
  labels:
    kubernetes.io/service-name: homeassistant-native
addressType: IPv4
ports:
- name: http
  port: 8123
  protocol: TCP
endpoints:
- addresses:
  - 192.168.1.90
  conditions:
    ready: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: homeassistant-native
spec:
  selector:
    matchLabels:
      app: homeassistant-native
  endpoints:
  - port: http
    path: /api/prometheus
    interval: 60s
    scrapeTimeout: 30s
    authorization:
      type: Bearer
      credentials:
        name: homeassistant-metrics-secret
        key: HASS_TOKEN
