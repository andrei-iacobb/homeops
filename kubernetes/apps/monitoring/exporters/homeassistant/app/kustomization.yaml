---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - secret.sops.yaml
# Name hash left on so an edit to bridge.py rolls the Deployment.
configMapGenerator:
  - name: homeassistant-metrics-bridge
    files:
      - bridge.py
