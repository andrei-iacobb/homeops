---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-exporter
  labels:
    app: truenas-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: truenas-exporter
  template:
    metadata:
      labels:
        app: truenas-exporter
      annotations:
        # OpenTelemetry SDK injected by the operator (monitoring/otel-operator).
        instrumentation.opentelemetry.io/inject-python: "default"
    spec:
      containers:
      - name: exporter
        image: ghcr.io/andrei-iacobb/patched/truenas-exporter:security-20261028-a720c4c9-p20261128@sha256:c39b313d980190d101630d31b71b0fc74de89682de6e1a55aa4c1a49068c3fe9
        ports:
        - name: metrics
          containerPort: 9814
        env:
        - name: TRUENAS_HOST
          valueFrom:
            secretKeyRef:
              name: truenas-secret
              key: TRUENAS_HOST
        - name: TRUENAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: truenas-secret
              key: TRUENAS_API_KEY
        volumeMounts:
        - name: exporter-script
          mountPath: /app/truenas-exporter.py
          subPath: truenas-exporter.py
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 768Mi
      volumes:
      - name: exporter-script
        configMap:
          name: truenas-exporter-script
