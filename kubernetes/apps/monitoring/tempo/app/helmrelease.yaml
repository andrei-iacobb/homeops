---
# Trace store for OpenTelemetry-instrumented apps. The metrics generator turns
# spans into request rate/error/duration metrics and a service graph in
# Prometheus, so every instrumented app gets RED metrics for free.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  values:
    tempo:
      # The single-binary chart is deprecated and its last release (1.24.4)
      # still ships 2.9.0 (2 critical CVEs); run the current 2.x patch.
      # Patched rebuild (andrei/patched-images) of grafana/tempo 2.10.10.
      registry: ghcr.io
      repository: andrei-iacobb/patched/tempo
      tag: 2.10.10-p20261128@sha256:84e96c37de0545d1b1b74448421818318492e9a817ce1c28cf7bfdf514a0c601
      reportingEnabled: false
      retention: 168h
      memBallastSizeMbs: 0
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
              - local-blocks
    persistence:
      enabled: true
      storageClassName: openebs-hostpath
      size: 10Gi
