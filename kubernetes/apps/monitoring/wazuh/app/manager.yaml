apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/part-of: wazuh
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wazuh-manager
  ports:
  - name: api
    port: 55000
    targetPort: 55000
  - name: registration
    port: 1515
    targetPort: 1515
  - name: agents-events
    port: 1514
    targetPort: 1514
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  labels:
    app.kubernetes.io/name: wazuh-manager
    app.kubernetes.io/part-of: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  serviceName: wazuh-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-manager
        app.kubernetes.io/part-of: wazuh
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      volumes:
      - name: config
        configMap:
          name: wazuh-manager-conf
      - name: filebeat-certs
        secret:
          secretName: wazuh-manager-certs
      - name: wazuh-authd-pass
        secret:
          secretName: wazuh-credentials
          items:
          - key: authd.pass
            path: authd.pass
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: wazuh-manager
        image: wazuh/wazuh-manager:4.14.10@sha256:dcda4869e2f792e92f03bce93f85b4bdf103756ea61cfca8ba9f3eabeb05365b
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          capabilities:
            add:
            - SYS_CHROOT
        readinessProbe:
          tcpSocket:
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: config
          mountPath: /wazuh-config-mount/etc/ossec.conf
          subPath: ossec.conf
          readOnly: true
        - name: filebeat-certs
          mountPath: /etc/ssl/root-ca.pem
          readOnly: true
          subPath: root-ca.pem
        - name: filebeat-certs
          mountPath: /etc/ssl/filebeat.pem
          subPath: filebeat.pem
          readOnly: true
        - name: filebeat-certs
          mountPath: /etc/ssl/filebeat.key
          subPath: filebeat-key.pem
          readOnly: true
        - name: wazuh-authd-pass
          mountPath: /wazuh-config-mount/etc/authd.pass
          subPath: authd.pass
          readOnly: true
        - name: wazuh-manager
          mountPath: /var/ossec/api/configuration
          subPath: wazuh/var/ossec/api/configuration
        - name: wazuh-manager
          mountPath: /var/ossec/etc
          subPath: wazuh/var/ossec/etc
        - name: wazuh-manager
          mountPath: /var/ossec/logs
          subPath: wazuh/var/ossec/logs
        - name: wazuh-manager
          mountPath: /var/ossec/queue
          subPath: wazuh/var/ossec/queue
        - name: wazuh-manager
          mountPath: /var/ossec/var/multigroups
          subPath: wazuh/var/ossec/var/multigroups
        - name: wazuh-manager
          mountPath: /var/ossec/integrations
          subPath: wazuh/var/ossec/integrations
        - name: wazuh-manager
          mountPath: /var/ossec/active-response/bin
          subPath: wazuh/var/ossec/active-response/bin
        - name: wazuh-manager
          mountPath: /var/ossec/agentless
          subPath: wazuh/var/ossec/agentless
        - name: wazuh-manager
          mountPath: /var/ossec/wodles
          subPath: wazuh/var/ossec/wodles
        - name: wazuh-manager
          mountPath: /etc/filebeat
          subPath: filebeat/etc/filebeat
        - name: wazuh-manager
          mountPath: /var/lib/filebeat
          subPath: filebeat/var/lib/filebeat
        - name: config
          mountPath: /wazuh-config-mount/etc/decoders/home-syslog-decoders.xml
          subPath: home-syslog-decoders.xml
          readOnly: true
        - name: config
          mountPath: /wazuh-config-mount/etc/rules/home-syslog-rules.xml
          subPath: home-syslog-rules.xml
          readOnly: true
        - name: config
          mountPath: /wazuh-config-mount/etc/decoders/home-monitoring-decoder.xml
          subPath: home-monitoring-decoder.xml
          readOnly: true
        - name: config
          mountPath: /wazuh-config-mount/etc/rules/home-monitoring-rules.xml
          subPath: home-monitoring-rules.xml
          readOnly: true
        - name: config
          mountPath: /wazuh-config-mount/etc/decoders/home-monitoring-loki-decoder.xml
          subPath: home-monitoring-loki-decoder.xml
          readOnly: true
        - name: config
          mountPath: /wazuh-config-mount/etc/rules/home-monitoring-loki-rules.xml
          subPath: home-monitoring-loki-rules.xml
          readOnly: true
        ports:
        - containerPort: 1514
          name: agents-events
        - containerPort: 1515
          name: registration
        - containerPort: 55000
          name: api
        env:
        - name: INDEXER_URL
          value: https://wazuh-indexer:9200
        - name: INDEXER_USERNAME
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: INDEXER_USERNAME
        - name: INDEXER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: INDEXER_PASSWORD
        - name: FILEBEAT_SSL_VERIFICATION_MODE
          value: full
        - name: SSL_CERTIFICATE_AUTHORITIES
          value: /etc/ssl/root-ca.pem
        - name: SSL_CERTIFICATE
          value: /etc/ssl/filebeat.pem
        - name: SSL_KEY
          value: /etc/ssl/filebeat.key
        - name: API_USERNAME
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: API_USERNAME
        - name: API_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: API_PASSWORD
        - name: WAZUH_CLUSTER_KEY
          valueFrom:
            secretKeyRef:
              name: wazuh-credentials
              key: WAZUH_CLUSTER_KEY
      - name: home-monitoring
        image: docker.io/library/python:3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
        command:
        - python3
        - -u
        - /app/home-monitoring-bridge.py
        env:
        - name: STATE_DIR
          value: /var/ossec/logs/home-monitoring
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /app/home-monitoring-bridge.py
          subPath: home-monitoring-bridge.py
          readOnly: true
        - name: wazuh-manager
          mountPath: /var/ossec/logs
          subPath: wazuh/var/ossec/logs
      - name: home-log-monitoring
        image: docker.io/library/python:3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
        command:
        - python3
        - -u
        - /app/home-monitoring-loki-bridge.py
        env:
        - name: STATE_DIR
          value: /var/ossec/logs/home-log-monitoring
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /app/home-monitoring-loki-bridge.py
          subPath: home-monitoring-loki-bridge.py
          readOnly: true
        - name: wazuh-manager
          mountPath: /var/ossec/logs
          subPath: wazuh/var/ossec/logs
  volumeClaimTemplates:
  - metadata:
      name: wazuh-manager
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: openebs-hostpath
      resources:
        requests:
          storage: 10Gi
