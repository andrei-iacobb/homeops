# Indexer service: REST API and node transport. Headless and cluster-internal
# only (upstream exposes the API through a LoadBalancer; this demo does not).
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  labels:
    app.kubernetes.io/name: wazuh-indexer
    app.kubernetes.io/part-of: wazuh
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wazuh-indexer
  ports:
    - name: indexer-rest
      port: 9200
      targetPort: 9200
    - name: indexer-nodes
      port: 9300
      targetPort: 9300
---
# Indexer StatefulSet: one node.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  labels:
    app.kubernetes.io/name: wazuh-indexer
    app.kubernetes.io/part-of: wazuh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  serviceName: wazuh-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh-indexer
        app.kubernetes.io/part-of: wazuh
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      # fsGroup makes the data volume and the 0600 secret files usable by
      # uid/gid 1000, so upstream's root chown init container is not needed.
      # Upstream's privileged vm.max_map_count init container is dropped too:
      # see discovery.type / node.store.allow_mmap in config/opensearch.yml.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: indexer-certs
          secret:
            secretName: wazuh-indexer-certs
            defaultMode: 0600
        - name: indexer-conf
          configMap:
            name: wazuh-indexer-conf
            defaultMode: 0600
        - name: indexer-users
          secret:
            secretName: wazuh-credentials
            defaultMode: 0600
            items:
              - key: internal_users.yml
                path: internal_users.yml
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.10@sha256:e56f85ed9e79f113c0f2d2a7965171cd8e063262ec88e110086acdb1f69f2240
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: indexer-rest
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: wazuh-indexer
              mountPath: /var/lib/wazuh-indexer
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/node-key.pem
              subPath: node-key.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/node.pem
              subPath: node.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
              subPath: root-ca.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/admin.pem
              subPath: admin.pem
              readOnly: true
            - name: indexer-certs
              mountPath: /usr/share/wazuh-indexer/config/certs/admin-key.pem
              subPath: admin-key.pem
              readOnly: true
            - name: indexer-conf
              mountPath: /usr/share/wazuh-indexer/config/opensearch.yml
              subPath: opensearch.yml
              readOnly: true
            - name: indexer-users
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
          ports:
            - containerPort: 9200
              name: indexer-rest
            - containerPort: 9300
              name: indexer-nodes
  volumeClaimTemplates:
    - metadata:
        name: wazuh-indexer
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 20Gi
