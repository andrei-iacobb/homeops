apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./secret.sops.yaml
- ./certs.sops.yaml
- ./grafana-datasource.sops.yaml
- ./grafana-dashboard.yaml
- ./root-ca.yaml
- ./indexer.yaml
- ./manager.yaml
- ./dashboard.yaml
- ./httproute.yaml
- ./networkpolicy.yaml
- ./home-syslog.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
- name: wazuh-indexer-conf
  files:
  - config/opensearch.yml
- name: wazuh-manager-conf
  files:
  - config/ossec.conf
  - config/tpic_demo_decoders.xml
  - config/tpic_demo_rules.xml
  - config/10-tpic-demo.sh
  - config/sample-suspicious-transfer.log
  - config/sample-benign-backup.log
  - config/home-syslog-decoders.xml
  - config/home-syslog-rules.xml
  - config/home-monitoring-bridge.py
  - config/home-monitoring-decoder.xml
  - config/home-monitoring-rules.xml
- name: wazuh-dashboard-conf
  files:
  - config/opensearch_dashboards.yml
