apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./secret.sops.yaml
- ./certs.sops.yaml
- ./grafana-datasource.sops.yaml
- ./m365.sops.yaml
- ./root-ca.yaml
- ./indexer.yaml
- ./manager.yaml
- ./dashboard.yaml
- ./httproute.yaml
- ./networkpolicy.yaml
- ./home-syslog.yaml
- ./home-agents.yaml
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
- name: wazuh-indexer-conf
  files:
  - config/opensearch.yml
- name: wazuh-manager-conf
  files:
  - config/ossec.conf
  - config/20-m365.sh
  - config/home-syslog-decoders.xml
  - config/home-syslog-rules.xml
  - config/home-monitoring-bridge.py
  - config/home-monitoring-decoder.xml
  - config/home-monitoring-rules.xml
  - config/home-monitoring-loki-bridge.py
  - config/home-monitoring-loki-decoder.xml
  - config/home-monitoring-loki-rules.xml
- name: wazuh-dashboard-conf
  files:
  - config/opensearch_dashboards.yml
