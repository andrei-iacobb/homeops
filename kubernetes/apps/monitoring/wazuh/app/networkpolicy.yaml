apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-indexer
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-indexer
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-manager
    - matchLabels:
        app.kubernetes.io/name: wazuh-dashboard
    - matchLabels:
        app.kubernetes.io/name: grafana
    toPorts:
    - ports:
      - port: '9200'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-indexer
  - fromEntities:
    - host
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-indexer
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-manager
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-dashboard
    toPorts:
    - ports:
      - port: '55000'
        protocol: TCP
  - fromEntities:
    - host
  - fromCIDR:
    - 192.168.1.1/32
    - 192.168.1.175/32
    - 192.168.1.180/32
    - 192.168.1.213/32
    - 192.168.1.133/32
    toPorts:
    - ports:
      - port: '5514'
        protocol: UDP
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-indexer
    toPorts:
    - ports:
      - port: '9200'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - port: '9090'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: loki
    toPorts:
    - ports:
      - port: '3100'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-dashboard
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh-dashboard
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: network
        gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    toPorts:
    - ports:
      - port: '5601'
        protocol: TCP
  - fromEntities:
    - host
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-indexer
    toPorts:
    - ports:
      - port: '9200'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: wazuh-manager
    toPorts:
    - ports:
      - port: '55000'
        protocol: TCP
