---
# wazuh.iacob.uk on envoy-internal. Authentik forward auth is inherited from
# the gateway (network/envoy-gateway/app/sso.yaml); the dashboard's own login
# sits behind it. Do not add this route to monitoring/sso-bypass.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wazuh
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - wazuh.iacob.uk
  rules:
    - backendRefs:
        - name: wazuh-dashboard
          port: 443
---
# The dashboard serves HTTPS with a certificate from the demo root CA. Envoy
# re-encrypts to it and verifies both the chain and the hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: wazuh-dashboard
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: wazuh-dashboard
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: wazuh-root-ca
    hostname: wazuh-dashboard.monitoring.svc.cluster.local
