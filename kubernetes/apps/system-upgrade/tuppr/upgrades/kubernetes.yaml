---
# Kubernetes control plane + kubelets. No node reboot; static pods and kubelets
# restart in place. Its own 03:00 slot, after Talos.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.36.6
  maintenance:
    windows:
      # Start gate only: a node already upgrading finishes, so leave the following hours as overrun.
      - start: "0 3 * * *"
        duration: 1h
        timezone: Europe/London
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 10m
