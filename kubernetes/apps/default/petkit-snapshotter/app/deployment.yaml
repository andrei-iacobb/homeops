---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petkit-snapshotter
  namespace: default
  labels:
    app: petkit-snapshotter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petkit-snapshotter
  template:
    metadata:
      labels:
        app: petkit-snapshotter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: petkit-snapshotter
          image: python:3.15.0-slim@sha256:2da676046630d7bf14c6764ae1143dc7fa0377a53f94bf5a642f0b214aca5bce
          command: ["python3", "/app/snapshotter.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HA_URL
              value: "https://hass.iacob.co.uk"
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: petkit-snapshotter-secret
                  key: HASS_TOKEN
            - name: PUBLIC_BASE_URL
              value: "https://hass.iacob.uk/petkit-snapshots"
            - name: STORAGE_DIR
              value: "/data"
            - name: INDEX_PATH
              value: "/app/index.html"
            - name: PORT
              value: "8080"
            - name: TMPDIR
              value: "/tmp"
            - name: POLL_SECONDS
              value: "30"
            - name: RETENTION_DAYS
              value: "30"
            - name: MAX_SNAPSHOTS
              value: "1000"
            - name: TIME_ZONE
              value: "Europe/London"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: petkit-snapshotter-code
        - name: data
          persistentVolumeClaim:
            claimName: petkit-snapshotter-data
        - name: tmp
          emptyDir: {}
