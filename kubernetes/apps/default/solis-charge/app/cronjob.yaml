---
# Programs Solis inverter charge / discharge slots based on:
#   - Octopus Agile rates (charge when <= 15p/kWh)
#   - Octoplus Free Electricity / Power-ups (force-charge during)
#   - Octoplus Saving Sessions (discharge during)
#
# Hourly cadence so Power-up / Saving Session announcements made during the
# day are picked up without waiting for the nightly run.
#
# Times sent to the inverter are UTC because the SolisCloud station is
# configured as UTC+0 and the HACS solis integration does not TZ-convert.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: solis-charge
spec:
  schedule: "5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: solis-charge
              image: python:3.14-alpine
              command:
                - python
                - /scripts/solis_agile_charge.py
              envFrom:
                - secretRef:
                    name: solis-charge-secret
              # TEMPORARY - diagnostic charge for the night of 2026-07-28/29.
              # The battery SOC sensor reports physically impossible swings
              # (9% -> 100% within minutes while pack voltage holds at 53.3V),
              # so we want one clean overnight fill followed by an undisturbed
              # discharge to see whether the pack itself behaves. Agile has no
              # sub-15p slot tonight; the cheapest overnight block is ~22p.
              # Raise the cap to 23p and restrict to 00:00-05:00 UK so the
              # optimizer takes the overnight block rather than tomorrow's
              # cheaper midday slots, which solar would contaminate.
              # REVERT once the discharge curve has been captured.
              env:
                - name: MAX_RATE
                  value: "0.23"
                - name: CHARGE_WINDOW_START
                  value: "00:00"
                - name: CHARGE_WINDOW_END
                  value: "05:00"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: solis-charge-script
