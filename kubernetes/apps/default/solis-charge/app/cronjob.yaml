---
# Programs Solis inverter charge / discharge slots based on:
#   - Octopus Agile rates (charge when <= 15p/kWh)
#   - Octoplus Free Electricity / Power-ups (force-charge during)
#   - Octoplus Saving Sessions (discharge during)
#
# Every 15 minutes: Power-up / Saving Session announcements made during the
# day are picked up quickly, and a slot the inverter is not actually running
# is caught and rewritten within a quarter hour of the window opening (see
# verify_charging in the script). Runs at :05 rather than :00 so the Octopus
# rate entities have rolled over first.
#
# Slots are written straight to the SolisCloud open API (window, current and
# the per-slot on/off switch bit the HACS integration cannot set). Times are
# UTC because the SolisCloud station is configured as UTC+0.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: solis-charge
spec:
  schedule: "5,20,35,50 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      # Every register read is a live Modbus round-trip through the
      # datalogger (10-30s), so a run costs ~90s and a bad one much more.
      # concurrencyPolicy Forbid means a job that hangs would block the
      # schedule indefinitely, so bound it below the 15 min cadence.
      activeDeadlineSeconds: 660
      template:
        metadata:
          annotations:
            # OpenTelemetry SDK injected by the operator (monitoring/otel-operator).
            instrumentation.opentelemetry.io/inject-python: "default"
            # Alpine image: use the musl build of the SDK.
            instrumentation.opentelemetry.io/otel-python-platform: musl
        spec:
          restartPolicy: OnFailure
          containers:
            - name: solis-charge
              image: python:3.15.2-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
              command:
                - python
                - /scripts/solis_agile_charge.py
              envFrom:
                - secretRef:
                    name: solis-charge-secret
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi # +OpenTelemetry SDK overhead
          volumes:
            - name: script
              configMap:
                name: solis-charge-script
