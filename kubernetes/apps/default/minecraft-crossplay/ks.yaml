---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft-crossplay
spec:
  interval: 1h
  path: ./kubernetes/apps/default/minecraft-crossplay/app
  postBuild:
    substitute:
      APP: minecraft-crossplay
      APP_PVC: minecraft-crossplay
      # Every 6h rather than nightly - this is the world people actually build
      # in, and restic dedupes, so the extra runs cost only changed chunks.
      # Caps worst-case loss at 6h if the world itself has to be restored.
      VOLSYNC_SCHEDULE: "35 */6 * * *"
      MOVER_UID: "1000"
      MOVER_GID: "1000"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: volsync-secret
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
