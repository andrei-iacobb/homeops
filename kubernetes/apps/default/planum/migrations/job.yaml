---
apiVersion: batch/v1
kind: Job
metadata:
  name: planum-migrate-4125db2f6edf
  annotations:
    # Recreate the immutable Job when the pinned image changes. Retain completion for Flux.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planum
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/andrei-iacobb/planum@sha256:4125db2f6edf4770b7f2f6753ac1c67f09b47ea1ffa626f8594204136380522e
          command: [node, /repo/server/dist/db/migrate.js]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: planum-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
