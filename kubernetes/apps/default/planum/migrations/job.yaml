---
apiVersion: batch/v1
kind: Job
metadata:
  name: planum-migrate-66e758c97345
  annotations:
    # Recreate the immutable Job when the pinned image changes. Retain completion for Flux.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planum
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: git-iacob-pull-secret
      containers:
        - name: migrate
          image: git.iacob.co.uk/andrei/planum:security-20261028-c8c5802@sha256:66e758c97345fb81cc63d1c429680e09e6de186f3d978559a98a0c5364c0dabd
          command: [node, /repo/server/dist/db/migrate.js]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: planum-secret
          env:
            # Reuse the existing encrypted key without changing SOPS authenticated paths.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: planum-secret
                  key: JWT_SECRET
            - name: BETTER_AUTH_URL
              value: "https://planum.iacob.co.uk"
            - name: REGISTRATION_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
