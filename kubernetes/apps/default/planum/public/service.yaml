---
apiVersion: v1
kind: Service
metadata:
  name: planum-public
spec:
  selector:
    app.kubernetes.io/name: planum
    # Only the Better Auth backend carries this value; legacy auth cannot receive public traffic.
    planum.iacob.co.uk/public-api: "better-auth-v1"
  ports:
    - name: http
      port: 4050
      targetPort: http
