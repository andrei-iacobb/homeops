---
apiVersion: v1
kind: Service
metadata:
  name: planum-public
spec:
  selector:
    app.kubernetes.io/name: planum
    # Older backends never carry this label, including during rollback or a failed rollout.
    planum.iacob.co.uk/public-api: "v1"
  ports:
    - name: http
      port: 4050
      targetPort: http
