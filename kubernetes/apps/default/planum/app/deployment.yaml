---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planum
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: planum
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: planum
      app.kubernetes.io/instance: planum
      app.kubernetes.io/name: planum
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: planum
        app.kubernetes.io/instance: planum
        app.kubernetes.io/name: planum
        planum.iacob.co.uk/public-api: "v1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: planum
          image: ghcr.io/andrei-iacobb/planum@sha256:4125db2f6edf4770b7f2f6753ac1c67f09b47ea1ffa626f8594204136380522e
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: planum-secret
          env:
            # Both routes overwrite XFF with Envoy's verified downstream address.
            - name: TRUSTED_PROXY_HOPS
              value: "1"
          ports:
            - name: http
              containerPort: 4050
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
