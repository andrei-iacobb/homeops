---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planum
  namespace: default
  labels:
    app.kubernetes.io/name: planum
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: planum
      app.kubernetes.io/instance: planum
      app.kubernetes.io/name: planum
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: planum
        app.kubernetes.io/instance: planum
        app.kubernetes.io/name: planum
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: planum
          image: ghcr.io/andrei-iacobb/planum:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: planum-secret
          ports:
            - name: http
              containerPort: 4050
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
