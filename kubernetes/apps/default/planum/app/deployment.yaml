---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planum
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: planum
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: planum
      app.kubernetes.io/instance: planum
      app.kubernetes.io/name: planum
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: planum
        app.kubernetes.io/instance: planum
        app.kubernetes.io/name: planum
        planum.iacob.co.uk/public-api: "better-auth-v1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: git-iacob-pull-secret
      containers:
        - name: planum
          image: git.iacob.co.uk/andrei/planum@sha256:24edf2dbafa90553858bd65319d51b4f4418d094589ea44fa707754dc6f8c3d2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: planum-secret
          env:
            # Reuse the existing encrypted key without changing SOPS authenticated paths.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: planum-secret
                  key: JWT_SECRET
            - name: BETTER_AUTH_URL
              value: "https://planum.iacob.co.uk"
            - name: REGISTRATION_ENABLED
              value: "false"
            # Both routes overwrite XFF with Envoy's verified downstream address.
            - name: TRUSTED_PROXY_HOPS
              value: "1"
          ports:
            - name: http
              containerPort: 4050
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
