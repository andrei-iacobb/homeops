---
# Second path to the server, alongside the dedicated VIP in
# service-loadbalancer.yaml. This one rides the envoy-internal VIP so any
# *.iacob.uk name works without its own DNS record.
#
# Trade-off: Envoy SNATs, so connections arriving this way show up in the
# server log as the envoy pod IP. The 192.168.1.13 VIP keeps real client IPs
# (externalTrafficPolicy: Local) - prefer it for anything IP-based.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: minecraft-bedrock
  namespace: default
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: minecraft-bedrock
  rules:
    - backendRefs:
        - name: minecraft-bedrock
          port: 19132
