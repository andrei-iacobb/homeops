---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-buildkit-config
  namespace: default
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
      shutdown_timeout: 25m
      fetch_timeout: 30s
      fetch_interval: 5s
      # Only these reach job steps; the runner's own env (registration token) does not.
      envs:
        PATH: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        BUILDKIT_HOST: unix:///run/buildkit/buildkitd.sock
        TRIVY_CACHE_DIR: /data/trivy-cache
        TMPDIR: /data/tmp
    cache:
      enabled: false
    host:
      workdir_parent: /data/workdir
