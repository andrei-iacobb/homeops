---
# Self-hosted Renovate running against Forgejo (git.iacob.co.uk) - replaces the
# Mend-hosted GitHub App as part of the Forgejo-primary experiment.
# Dry-run first: flip RENOVATE_DRY_RUN to null/remove once output looks right.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "5,25,45 * * * *" # every 20 min: Renovate merges at most two PRs per run, so hourly drains the queue too slowly
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: renovate
              # Renovate ships several releases a day, so a pinned version would be a
              # PR every run. Track the major and re-pull each run instead; Renovate
              # itself proposes the next major.
              image: ghcr.io/renovatebot/renovate:44
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: renovate-secret
              env:
                - name: RENOVATE_PLATFORM
                  value: gitea
                - name: RENOVATE_ENDPOINT
                  value: https://git.iacob.co.uk/api/v1
                - name: RENOVATE_REPOSITORIES
                  value: andrei/homeops
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  # andrei@iacob.co.uk is verified on the GitHub account, so
                  # commits authored by it (mirrored to github.com/andrei-iacobb)
                  # count toward the contribution graph. renovate@iacob.co.uk did
                  # not resolve to the account.
                  value: "andrei <andrei@iacob.co.uk>"
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                # Registry auth so Renovate can look up the private self-built images
                # (dashboard: "No docker auth found" / "Could not determine new digest").
                # $(VAR) expands from renovate-secret via envFrom.
                - name: RENOVATE_HOST_RULES
                  value: >-
                    [{"hostType":"docker","matchHost":"ghcr.io","username":"andrei-iacobb","password":"$(GITHUB_COM_TOKEN)"},
                    {"hostType":"docker","matchHost":"git.iacob.co.uk","username":"andrei","password":"$(FORGEJO_REGISTRY_TOKEN)"}]
              volumeMounts:
                - name: work
                  mountPath: /tmp/renovate
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 5Gi
