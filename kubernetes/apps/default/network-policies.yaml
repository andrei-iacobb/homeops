---
# Default namespace: allow ingress from envoy gateway, intra-namespace, and health probes
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-ingress
  namespace: default
spec:
  endpointSelector: {}
  ingress:
    # Envoy Gateway ingress (HTTPRoutes - both internal and external)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
    # Intra-namespace (apps may query each other, e.g. lastorders→immich)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
    # Media namespace (arr apps may call back to pulsarr)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # Monitoring namespace (prometheus scraping)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # Kubelet health probes
    - fromEntities:
        - host
---
# Apps that trust Authentik identity headers or have no login of their own:
# only the gateway (and kubelet probes) may reach them, never other pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sso-only-apps
  namespace: default
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [slate]
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [default, media, monitoring]
