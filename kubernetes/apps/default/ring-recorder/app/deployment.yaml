---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ring-recorder
  namespace: default
  labels:
    app: ring-recorder
spec:
  replicas: 1
  # One pod at a time: Ring rotates the refresh token, two pods would fight over it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ring-recorder
  template:
    metadata:
      labels:
        app: ring-recorder
      annotations:
        # OpenTelemetry SDK injected by the operator (monitoring/otel-operator).
        instrumentation.opentelemetry.io/inject-python: "default"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ring-recorder
          image: python:3.15.2-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
          command: ["python3", "/app/recorder.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RING_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ring-recorder-secret
                  key: RING_REFRESH_TOKEN
            - name: RING_HARDWARE_ID
              valueFrom:
                secretKeyRef:
                  name: ring-recorder-secret
                  key: RING_HARDWARE_ID
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ring-recorder-secret
                  key: GEMINI_API_KEY
                  optional: true
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ring-recorder-secret
                  key: API_TOKEN
                  optional: true
            # Home Assistant webhook for phone alerts; the id is secret.
            - name: HA_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ring-recorder-secret
                  key: HA_WEBHOOK_URL
                  optional: true
            - name: PUBLIC_BASE_URL
              value: "https://hass.iacob.uk/ring-events"
            # Signed thumbnail links in notifications must load on the phone away from home.
            - name: NOTIFY_BASE_URL
              value: "https://hass.${SECRET_DOMAIN}/ring-events"
            - name: AUTH_HOSTS
              value: "hass.${SECRET_DOMAIN}"
            - name: HA_URL
              value: "http://homeassistant.external-services.svc.cluster.local:8123"
            - name: STORAGE_DIR
              value: "/data"
            - name: INDEX_PATH
              value: "/app/index.html"
            - name: CARD_PATH
              value: "/app/ring-events-card.js"
            - name: PORT
              value: "8080"
            - name: TMPDIR
              value: "/tmp"
            - name: POLL_SECONDS
              value: "60"
            - name: RETENTION_DAYS
              value: "180"
            - name: TIME_ZONE
              value: "Europe/London"
            # Outdoor cameras polled this often so a clip is picked up soon after it ends.
            - name: FAST_POLL_SECONDS
              value: "15"
            # Quick look: three stills around Ring's detection moment, answered in ~2 s.
            - name: GEMINI_QUICK_MODEL
              value: "gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite"
            # Full pass: whole clip at low media resolution (~3k tokens). 3.5 Flash-Lite
            # reads these cameras as well as 3.5 Flash with the scene notes, and Flash's
            # free tier is only 20 requests a day.
            - name: GEMINI_MODEL
              value: "gemini-3.5-flash-lite,gemini-2.5-flash,gemini-flash-lite-latest,gemini-3.1-flash-lite"
            - name: FFMPEG
              value: "/opt/ffmpeg/ffmpeg"
            - name: SCENES_PATH
              value: "/app/scenes.json"
            # Questions via /api/analyze: stronger model first.
            # Indoor cameras are archived but never sent to Gemini (free-tier key).
            - name: GEMINI_EXCLUDE_DEVICES
              value: "hallway,downstairs,living,meli-s"
            - name: GEMINI_ASK_MODEL
              value: "gemini-3.5-flash,gemini-flash-latest,gemini-3.1-flash-lite"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: ffmpeg
              mountPath: /opt/ffmpeg
              readOnly: true
      volumes:
        # Static ffmpeg/ffprobe (FROM scratch) mounted as an image volume for frame grabs.
        - name: ffmpeg
          image:
            reference: mwader/static-ffmpeg:9.0.2-1@sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822
            pullPolicy: IfNotPresent
        - name: app
          configMap:
            name: ring-recorder-code
        - name: data
          persistentVolumeClaim:
            claimName: ring-recorder-data
        - name: tmp
          emptyDir: {}
