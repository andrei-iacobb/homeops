---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ring-recorder
  namespace: default
  labels:
    app: ring-recorder
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hass.iacob.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ring-events
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ring-recorder
          port: 80
---
# Same app under the public HA hostname, so the dashboard card loads same-origin
# from anywhere. recorder.py requires a session (traded for a valid HA token) on
# AUTH_HOSTS; only /card.js, /healthz and /readyz are open there.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ring-recorder-external
  namespace: default
  labels:
    app: ring-recorder
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - hass.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ring-events
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ring-recorder
          port: 80
