---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burthorpe-pooch-parlour
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burthorpe-pooch-parlour
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burthorpe-pooch-parlour
      annotations:
        # OpenTelemetry SDK injected by the operator (monitoring/otel-operator).
        instrumentation.opentelemetry.io/inject-nodejs: "default"
    spec:
      nodeSelector:
        kubernetes.io/hostname: home-cluster
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/andrei-iacobb/burthorpe-pooch-parlour:6e70b54@sha256:4c4ecc87f35ecb0f8a0d25943f9e929960f610b7ac6274caec41b0a3277b1966
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi # +OpenTelemetry SDK overhead
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: image-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: image-cache
          emptyDir:
            sizeLimit: 128Mi
