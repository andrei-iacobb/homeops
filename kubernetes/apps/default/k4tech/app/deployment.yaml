apiVersion: apps/v1
kind: Deployment
metadata:
  name: k4tech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k4tech
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: k4tech
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/andrei-iacobb/patched/nginx-unprivileged:1.31.10-alpine-p20261128@sha256:783208e1a6b3b07eea02c98eb5e122e78992cb29a8d4b6592ee229f0639ad34f
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: site
          projected:
            sources:
              - configMap:
                  name: k4tech-site
              - configMap:
                  name: k4tech-image
              - configMap:
                  name: k4tech-image-fallback
        - name: nginx-conf
          configMap:
            name: k4tech-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
