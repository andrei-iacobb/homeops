apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - image-fallback.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  - name: k4tech-site
    files:
      - site/index.html
      - site/sitemap.xml
      - site/robots.txt
  - name: k4tech-image
    files:
      - img/workshop-640.avif
      - img/workshop-1080.avif
      - img/workshop-1600.avif
      - img/workshop-640.webp
      - img/workshop-1080.webp
      - img/workshop-1600.webp
