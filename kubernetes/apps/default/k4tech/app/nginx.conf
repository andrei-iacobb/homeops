server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # Images change by being renamed, so let browsers and Cloudflare keep them for a week.
    location ~* \.(avif|webp|jpe?g|png|svg)$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }
}
