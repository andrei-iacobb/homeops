apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k4tech
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - k4tech.co.uk
    - www.k4tech.co.uk
  rules:
    - backendRefs:
        - name: k4tech
          port: 8080
