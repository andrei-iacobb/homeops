---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neatplan
  namespace: default
  labels:
    app.kubernetes.io/name: neatplan
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: neatplan
      app.kubernetes.io/instance: neatplan
      app.kubernetes.io/name: neatplan
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: neatplan
        app.kubernetes.io/instance: neatplan
        app.kubernetes.io/name: neatplan
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Prisma migrations must land before the Next 16.3 app boots; the
        # migrator image's default CMD is `prisma migrate deploy`.
        - name: migrate
          image: ghcr.io/andrei-iacobb/neatplan-migrator:1b9b49b
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: neatplan-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrate-tmp
              mountPath: /tmp
      containers:
        - name: neatplan
          image: ghcr.io/andrei-iacobb/neatplan:1b9b49b
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: neatplan-secret
          env:
            - name: NEATPLAN_DATA_DIR
              value: /app/data
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: neatplan-secret
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: neatplan-secret
                  key: VAPID_PRIVATE_KEY
                  optional: true
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: neatplan-secret
                  key: VAPID_SUBJECT
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neatplan-data
        - name: migrate-tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
