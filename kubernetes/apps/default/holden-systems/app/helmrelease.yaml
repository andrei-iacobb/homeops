---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holden-systems
spec:
  chartRef:
    kind: OCIRepository
    name: holden-systems
  interval: 1h
  values:
    controllers:
      holden-systems:
        replicas: 2 # zero-downtime rollouts and survives single-pod restart
        pod:
          annotations:
            # OpenTelemetry SDK injected by the operator (monitoring/otel-operator).
            instrumentation.opentelemetry.io/inject-nodejs: "default"
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          app:
            image:
              repository: ghcr.io/andrei-iacobb/holden-systems-site
              # Next.js 16.4.6, node 24.22.3 runtime (holden-systems-site #49).
              tag: 14f004b@sha256:8715ac17070258d598bf3b0f068baf502b564e078fa4a34fd386ce4d2e207914
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 256Mi # +OpenTelemetry SDK overhead
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: holden-systems
    service:
      app:
        controller: holden-systems
        ports:
          http:
            port: *port
    persistence:
      # Keep the standalone Node runtime's temporary path writable while the
      # image root remains read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
