---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holden-systems
spec:
  chartRef:
    kind: OCIRepository
    name: holden-systems
  interval: 1h
  values:
    controllers:
      holden-systems:
        replicas: 2 # zero-downtime rollouts and survives single-pod restart
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
        containers:
          app:
            image:
              repository: ghcr.io/andrei-iacobb/holden-systems-site
              # Next.js 16.3 standalone image with the Mapbox Activity lifecycle fix.
              tag: 3020d9d@sha256:fa9ac0d08773921899cc75ad24927a543c888858d77dcf73a4ff99df79d68492
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: holden-systems
    service:
      app:
        controller: holden-systems
        ports:
          http:
            port: *port
    persistence:
      # Keep the standalone Node runtime's temporary path writable while the
      # image root remains read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
