---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: informate
spec:
  chartRef:
    kind: OCIRepository
    name: informate
  interval: 1h
  values:
    controllers:
      backend:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/andrei-iacobb/informate-backend
              tag: latest
            env:
              TZ: Europe/London
              OLLAMA_URL: http://ollama.ai.svc.cluster.local:11434
              # gemma3:27b is also pulled and gives better prose, but runs at
              # 3 tok/s on this CPU-only node vs 11 tok/s for 8b (~3min vs
              # ~35s per article). Swap here if quality matters more.
              OLLAMA_MODEL: llama3.1:8b
              # Ollama sizes threads from host CPU count and ignores the cgroup
              # limit; matching it to ollama's CPU limit measured 0.8 -> 11 tok/s.
              OLLAMA_NUM_THREAD: "16"
              DATABASE_URL: jdbc:postgresql://postgres.databases.svc.cluster.local:5432/informate
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: informate-secret
                    key: POSTGRES_USER
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: informate-secret
                    key: POSTGRES_PASSWORD
              # Qdrant runs in the databases namespace, not default
              QDRANT_URL: http://qdrant.databases.svc.cluster.local:6333
              SEARXNG_URL: http://searxng.default.svc.cluster.local:8080
              EMBEDDING_MODEL: nomic-embed-text
              IMAGE_DIR: /app/SiteImages
              CORS_ALLOWED_ORIGINS: https://informate.iacob.co.uk
              SESSION_TTL_HOURS: "12"
              # RSS connectors: poll cadence and per-source import cap, kept
              # low so feed imports cannot saturate the shared Ollama.
              FEED_POLL_MINUTES: "30"
              FEED_MAX_PER_POLL: "3"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 8080
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
      frontend:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/andrei-iacobb/informate-frontend
              tag: latest
            probes:
              liveness: &frontend-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *frontend-probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8080
      frontend:
        controller: frontend
        ports:
          http:
            port: 80
    persistence:
      images:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        size: 10Gi
        accessMode: ReadWriteOnce
        advancedMounts:
          backend:
            app:
              - path: /app/SiteImages
