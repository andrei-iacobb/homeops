---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-api
  namespace: default
  labels:
    app.kubernetes.io/name: inbi-api
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-api
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        # The dedicated migrator target is built from the same commit as the
        # API and owns the exact Prisma 7 migration command in its image CMD.
        - name: migrate
          image: ghcr.io/andrei-iacobb/inbi-fleet-migrator:1a6a60948ccfec2617358e93458a55b8060f6722@sha256:aeaeff58463449496cf4e5e699baca8a09079153b66a30b227384fd565d9b912
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inbi-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: api
          image: ghcr.io/andrei-iacobb/inbi-fleet-api:1a6a60948ccfec2617358e93458a55b8060f6722@sha256:937ad1e2eb4692f99cca6b608426ebb39f57e73b09e1cad06cdb15625a5564a8
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: inbi-secret
          env:
            - name: TZ
              value: Europe/London
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "4000"
            - name: API_HOST
              value: 0.0.0.0
            - name: API_LOG_LEVEL
              value: info
            # Both browser apps call the API same-origin through their own
            # /api prefix, so CORS only has to cover the office host.
            - name: API_CORS_ORIGIN
              value: https://inbi.iacobapp.dev
            # Receipt-scan QR codes point here. The scan page lives in the
            # office app, so the phone only ever talks to this host.
            - name: OFFICE_APP_BASE_URL
              value: https://inbi.iacobapp.dev
            # Media urls (photos, signatures, PODs) are built against this and
            # handed to browsers and tablets. Includes the /api prefix the
            # gateway strips, so links resolve as /api/v1/media/<token>.
            - name: API_PUBLIC_BASE_URL
              value: https://inbi.iacobapp.dev/api
            # Customer portal is not deployed yet; these stay pointed at the
            # office host so any link the API generates lands somewhere real
            # rather than on a dead hostname.
            - name: PUBLIC_BASE_URL
              value: https://inbi.iacobapp.dev
            - name: CUSTOMER_PORTAL_URL
              value: https://inbi.iacobapp.dev
            # What the API itself reads and writes through. The in-cluster
            # service, because the LAN hostname does not resolve from a pod
            # (CoreDNS knows nothing about *.iacob.uk).
            - name: S3_ENDPOINT
              value: http://inbi-minio.default.svc.cluster.local:9000
            # What client-facing presigned urls are signed against. A browser
            # resolves this itself, so it must be the reachable name.
            # LAN-only by choice - see httproute.yaml.
            - name: S3_PUBLIC_ENDPOINT
              value: https://inbi-s3.iacob.uk
            - name: S3_BUCKET
              value: inbi
            - name: S3_REGION
              value: auto
            - name: S3_FORCE_PATH_STYLE
              value: "true"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-api
  namespace: default
  labels:
    app.kubernetes.io/name: inbi-api
spec:
  selector:
    app.kubernetes.io/name: inbi-api
  ports:
    - name: http
      port: 4000
      targetPort: http
