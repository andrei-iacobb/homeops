---
# Office app - the operator UI. `/api` on the same host is rewritten onto the
# API service so the browser never makes a cross-origin call and no CORS
# preflight is involved.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-office
  labels:
    app.kubernetes.io/name: inbi-office
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - inbi.iacobapp.dev
  rules:
    # Longest prefix wins in Gateway API, so /api is matched ahead of /.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: inbi-api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inbi-office
          port: 3300
---
# S3 endpoint - LAN only, deliberately NOT on envoy-external.
#
# The API signs S3 URLs and hands them to clients to fetch directly, so this
# hostname has to be resolvable by whoever holds the URL. Keeping it off the
# public gateway means media (defect photos, POD signatures, receipt scans)
# only works from the LAN: a tablet on mobile data authenticates and syncs
# fine but fails on any photo upload or view.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-s3
  labels:
    app.kubernetes.io/name: inbi-minio
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - inbi-s3.iacob.uk
  rules:
    - backendRefs:
        - name: inbi-minio
          port: 9000
---
# LAN-side route for debugging without going out through Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-internal
  labels:
    app.kubernetes.io/name: inbi-office
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - inbi.iacob.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: inbi-api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inbi-office
          port: 3300
