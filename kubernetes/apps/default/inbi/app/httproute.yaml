---
# Office app - the operator UI. `/api` on the same host is rewritten onto the
# API service so the browser never makes a cross-origin call and no CORS
# preflight is involved.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-office
  labels:
    app.kubernetes.io/name: inbi-office
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - inbi.iacobapp.dev
  rules:
    # Match /api/v1 rather than bare /api. The office app serves its OWN Next
    # route handlers under /api (/api/logout, /api/search, /api/exports/*,
    # /api/expenses/receipts.csv) - a bare /api rule swallows all of them and
    # 404s them against Fastify. Every Fastify route lives under /v1, so this
    # prefix separates the two cleanly. Longest prefix wins, so these are
    # matched ahead of /.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: inbi-api
          port: 4000
    # Convenience only: lets the deployment be health-checked from outside.
    # Does not collide - the office app has no /api/health handler.
    - matches:
        - path:
            type: PathPrefix
            value: /api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      backendRefs:
        - name: inbi-api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inbi-office
          port: 3300
---
# S3 endpoint - LAN only, deliberately NOT on envoy-external.
#
# The API signs S3 URLs and hands them to clients to fetch directly, so this
# hostname has to be resolvable by whoever holds the URL. Keeping it off the
# public gateway means media (defect photos, POD signatures, receipt scans)
# only works from the LAN: a tablet on mobile data authenticates and syncs
# fine but fails on any photo upload or view.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-s3
  labels:
    app.kubernetes.io/name: inbi-minio
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - inbi-s3.iacob.uk
  rules:
    - backendRefs:
        - name: inbi-minio
          port: 9000
---
# LAN-side route for debugging without going out through Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inbi-internal
  labels:
    app.kubernetes.io/name: inbi-office
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - inbi.iacob.uk
  rules:
    # Same /api/v1 split as the public route - a bare /api prefix would
    # swallow the office app's own Next handlers (/api/logout, /api/search,
    # /api/exports/*) into Fastify.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: inbi-api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      backendRefs:
        - name: inbi-api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: inbi-office
          port: 3300
