---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-customer
  namespace: default
  labels:
    app.kubernetes.io/name: inbi-customer
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-customer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-customer
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: customer
          image: ghcr.io/andrei-iacobb/inbi-customer:latest
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Europe/London
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3400"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: API_INTERNAL_URL
              value: http://inbi-api.default.svc.cluster.local:4000
            - name: CUSTOMER_PORTAL_URL
              value: https://track.iacobapp.dev
            - name: SESSION_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: inbi-secret
                  key: SESSION_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 3400
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-customer
  namespace: default
  labels:
    app.kubernetes.io/name: inbi-customer
spec:
  selector:
    app.kubernetes.io/name: inbi-customer
  ports:
    - name: http
      port: 3400
      targetPort: http
