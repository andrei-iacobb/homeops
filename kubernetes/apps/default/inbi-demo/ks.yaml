---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: inbi-demo
spec:
  interval: 1h
  path: ./kubernetes/apps/default/inbi-demo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  timeout: 10m
  wait: true
