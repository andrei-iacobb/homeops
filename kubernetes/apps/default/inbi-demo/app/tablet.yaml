---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-demo-tablet
  labels:
    app.kubernetes.io/name: inbi-demo-tablet
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-demo-tablet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-demo-tablet
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: tablet
          image: ghcr.io/andrei-iacobb/inbi-fleet-driver-demo:c2c83bb02d11c8da7ffd55829db570c379e5d313@sha256:a296e5ce1fc65643f89df0cc6de7af3ab0ec4173eefdfe0f23bcb43f9fc25616
          env:
            - name: DEMO_LAUNCHER_ORIGIN
              value: https://inbi-demo.iacobapp.dev
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-demo-tablet
  labels:
    app.kubernetes.io/name: inbi-demo-tablet
spec:
  selector:
    app.kubernetes.io/name: inbi-demo-tablet
  ports:
    - name: http
      port: 8080
      targetPort: http
