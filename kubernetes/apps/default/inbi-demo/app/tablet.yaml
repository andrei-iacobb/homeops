---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-demo-tablet
  labels:
    app.kubernetes.io/name: inbi-demo-tablet
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-demo-tablet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-demo-tablet
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: tablet
          image: ghcr.io/andrei-iacobb/inbi-fleet-driver-demo:36ca5ed8460aea40073107d2412b6d9d8c9620ae@sha256:fab05cb6e21e3cd0c239f272f3cbbc02506019d30610053afd8b6a88be12c0c3
          env:
            - name: DEMO_LAUNCHER_ORIGIN
              value: https://inbi-demo.iacobapp.dev
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-demo-tablet
  labels:
    app.kubernetes.io/name: inbi-demo-tablet
spec:
  selector:
    app.kubernetes.io/name: inbi-demo-tablet
  ports:
    - name: http
      port: 8080
      targetPort: http
