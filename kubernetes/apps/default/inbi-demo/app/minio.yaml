---
# Media is synthetic and resettable, so this PVC is deliberately not copied to
# the production INBI bucket or VolSync backup set.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inbi-demo-minio
  labels:
    app.kubernetes.io/name: inbi-demo-minio
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-demo-minio
  labels:
    app.kubernetes.io/name: inbi-demo-minio
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-demo-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-demo-minio
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: create-bucket
          image: busybox:1.38
          command: ["sh", "-c", "mkdir -p /data/inbi-demo-media"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: inbi-demo-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inbi-demo-secret
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: s3
              containerPort: 9000
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inbi-demo-minio
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-demo-minio
  labels:
    app.kubernetes.io/name: inbi-demo-minio
spec:
  selector:
    app.kubernetes.io/name: inbi-demo-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
