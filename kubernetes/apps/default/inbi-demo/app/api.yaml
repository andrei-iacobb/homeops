---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inbi-demo-api
  labels:
    app.kubernetes.io/name: inbi-demo-api
spec:
  # Reset coordination is process-local, so the sandbox intentionally has one
  # API writer. Do not increase this without moving the reset gate to Postgres.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inbi-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inbi-demo-api
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.15-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
          command:
            - sh
            - -c
            - until pg_isready -h demo-postgres -U inbi_sandbox -d inbi_sandbox; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: migrate
          image: ghcr.io/andrei-iacobb/inbi-fleet-migrator:55035df907367443de14aae5a39257fbc5cd4b89@sha256:93aa7223f0c92664fc534c76f8df420f778331b4584a5c28268e397875f90dbc
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inbi-demo-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: wait-for-minio
          # Exact cached MinIO image includes the same mc release; upstream pulls now return 401.
          image: ghcr.io/andrei-iacobb/minio-recovery:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
          command:
            - sh
            - -c
            - until mc alias set demo http://inbi-demo-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing demo/inbi-demo-media
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: inbi-demo-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inbi-demo-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: seed
          image: ghcr.io/andrei-iacobb/inbi-fleet-api:55035df907367443de14aae5a39257fbc5cd4b89@sha256:5bf01fcfe3abfc1dec52e9b5fe633c42686ac0b6c42ad9703ecd009811a62966
          command: ["node", "dist/demo-seed.js"]
          envFrom:
            - secretRef:
                name: inbi-demo-secret
          env:
            - name: NODE_ENV
              value: production
            - name: DEMO_MODE
              value: "1"
            - name: DEMO_ORG_SLUG
              value: inbi-demo
            - name: DEMO_DEVICE_ID
              value: inbi-demo-tablet-01
            - name: DEMO_OFFICE_EMAIL
              value: presenter@demo.invalid
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/andrei-iacobb/inbi-fleet-api:55035df907367443de14aae5a39257fbc5cd4b89@sha256:5bf01fcfe3abfc1dec52e9b5fe633c42686ac0b6c42ad9703ecd009811a62966
          envFrom:
            - secretRef:
                name: inbi-demo-secret
          env:
            - name: TZ
              value: Europe/London
            - name: NODE_ENV
              value: production
            - name: DEMO_MODE
              value: "1"
            - name: DEMO_ORG_SLUG
              value: inbi-demo
            - name: DEMO_DEVICE_ID
              value: inbi-demo-tablet-01
            - name: DEMO_OFFICE_EMAIL
              value: presenter@demo.invalid
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "4000"
            - name: API_LOG_LEVEL
              value: info
            - name: API_CORS_ORIGIN
              value: https://inbi-demo.iacobapp.dev,https://inbi-demo-office.iacobapp.dev,https://inbi-demo-tablet.iacobapp.dev
            - name: API_PUBLIC_BASE_URL
              value: https://inbi-demo.iacobapp.dev/api
            - name: OFFICE_APP_BASE_URL
              value: https://inbi-demo-office.iacobapp.dev
            - name: PUBLIC_BASE_URL
              value: https://inbi-demo.iacobapp.dev
            - name: S3_ENDPOINT
              value: http://inbi-demo-minio:9000
            - name: S3_BUCKET
              value: inbi-demo-media
            - name: S3_REGION
              value: us-east-1
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: TRACKER_MOCK
              value: "1"
            - name: TRAFFIC_MOCK
              value: "1"
          ports:
            - name: http
              containerPort: 4000
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inbi-demo-api
  labels:
    app.kubernetes.io/name: inbi-demo-api
spec:
  selector:
    app.kubernetes.io/name: inbi-demo-api
  ports:
    - name: http
      port: 4000
      targetPort: http
