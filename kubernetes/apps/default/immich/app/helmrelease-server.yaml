---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-server
spec:
  chartRef:
    kind: OCIRepository
    name: immich
  interval: 1h
  values:
    controllers:
      immich-server:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              DB_HOSTNAME: postgres.databases.svc.cluster.local
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: IMMICH_DB_PASSWORD
              DB_DATABASE_NAME: immich
              REDIS_HOSTNAME: redis.databases.svc.cluster.local
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-secret
                    key: REDIS_PASSWORD
              IMMICH_MEDIA_LOCATION: /usr/src/app/upload
              IMMICH_ALLOW_SETUP: "false"
              IMMICH_HELMET_FILE: "true"
              IMMICH_MACHINE_LEARNING_URL: http://immich-ml:3003
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 4000m
                memory: 8Gi
          guest-proxy:
            image:
              repository: docker.io/nginx
              tag: 1.31-alpine
            command: ["/usr/sbin/nginx"]
            args: ["-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
            probes:
              liveness: &guest-proxy-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *guest-proxy-probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 2283
      guest:
        controller: immich-server
        ports:
          http:
            port: 8080
    persistence:
      upload:
        type: persistentVolumeClaim
        storageClass: nfs-immich
        size: 100Gi
        accessMode: ReadWriteMany
        advancedMounts:
          immich-server:
            app:
              - path: /usr/src/app/upload
      guest-proxy-config:
        type: configMap
        name: immich-guest-proxy-config
        advancedMounts:
          immich-server:
            guest-proxy:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          immich-server:
            guest-proxy:
              - path: /tmp
    route:
      app:
        hostnames: ["photos.iacob.uk"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 2283
      external:
        hostnames: ["photos.iacob.co.uk"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: guest
                port: 8080
