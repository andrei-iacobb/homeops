---
apiVersion: v1
kind: Service
metadata:
  name: android-emulator-loadbalancer
  namespace: default
  annotations:
    # Below the br0 DHCP pool (.10-.254). 192.168.1.15 was inside it and DHCP
    # had already leased it to VM 108 (ninja-srv2019), so the gateway ARP-resolved
    # the VIP to that Windows box and LAN/VPN adb went to the wrong host.
    lbipam.cilium.io/ips: "192.168.1.2"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: android-emulator
    app.kubernetes.io/instance: android-emulator
  ports:
    - name: adb
      protocol: TCP
      port: 5555
      targetPort: 5555
