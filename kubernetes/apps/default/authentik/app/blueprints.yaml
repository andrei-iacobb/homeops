---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
data:
  forward-auth.yaml: |
    version: 1
    metadata:
      name: homeops-forward-auth
    entries:
      # Domain-level forward auth for everything on envoy-internal (*.iacob.uk).
      # Envoy calls the embedded outpost via the SecurityPolicy in
      # kubernetes/apps/network/envoy-gateway/app/sso.yaml.
      - model: authentik_providers_proxy.proxyprovider
        id: forward-auth
        identifiers:
          name: forward-auth-iacob-uk
        attrs:
          mode: forward_domain
          external_host: https://authentik.iacob.uk
          cookie_domain: iacob.uk
          access_token_validity: days=30
          intercept_header_auth: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
          # Domain mode matches against the full URL (query included). These
          # paths carry their own API key / token auth and are hit by apps,
          # collectors and CLIs, not browsers.
          skip_path_regex: |
            ^(https?:)?//(sonarr|radarr|lidarr|readarr|prowlarr)\.iacob\.uk/(api|ping|feed)([/?].*)?$
            ^(https?:)?//(sabnzbd|bazarr|tautulli|paperless|mealie|frigate|firefly|scrutiny|tdarr|plans|notes|grafana|fan|lazylibrarian)\.iacob\.uk/api([/?].*)?$
            ^(https?:)?//(overseerr|tasks)\.iacob\.uk/api/v1([/?].*)?$
            ^(https?:)?//qbittorrent\.iacob\.uk/api/v2([/?].*)?$
            ^(https?:)?//prometheus\.iacob\.uk/api/v1([/?].*)?$
            ^(https?:)?//proxmox\.iacob\.uk/api2/json([/?].*)?$
            ^(https?:)?//uptime\.iacob\.uk/(api/push|api/badge|api/status-page)([/?].*)?$
            ^(https?:)?//(calibre-web|lazylibrarian)\.iacob\.uk/opds([/?].*)?$
            ^(https?:)?//drop\.iacob\.uk/(api|web/client/pubshares)([/?].*)?$
            ^(https?:)?//ersatztv\.iacob\.uk/(iptv|api|ffmpeg|hls|discover\.json|lineup|device\.xml)([/?].*)?$
            ^(https?:)?//dns[12]\.iacob\.uk/dns-query([/?].*)?$
            ^(https?:)?//n8n\.iacob\.uk/(webhook|webhook-test|webhook-waiting|form|form-test)([/?].*)?$
      - model: authentik_core.application
        identifiers:
          slug: homelab
        attrs:
          name: Homelab
          provider: !KeyOf forward-auth
          meta_launch_url: https://home.iacob.uk
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf forward-auth
  agent.yaml: |
    version: 1
    metadata:
      name: homeops-agent
    entries:
      # authentik Agent (endpoint devices + `ak` CLI login), per
      # https://docs.goauthentik.io/endpoint-devices/authentik-agent/configuration/
      - model: authentik_flows.flow
        id: device-code-flow
        identifiers:
          slug: default-device-code-flow
        attrs:
          name: Device code flow
          title: Device code flow
          designation: stage_configuration
          authentication: require_authenticated
      - model: authentik_brands.brand
        identifiers:
          domain: authentik-default
        attrs:
          flow_device_code: !KeyOf device-code-flow
      - model: authentik_providers_oauth2.oauth2provider
        id: authentik-cli
        identifiers:
          name: authentik-cli
        attrs:
          client_type: public
          client_id: authentik-cli
          grant_types:
            - authorization_code
            - refresh_token
            - urn:ietf:params:oauth:grant-type:device_code
          redirect_uris:
            - matching_mode: regex
              url: ^http://(localhost|127\.0\.0\.1)(:\d+)?(/.*)?$
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-authentik_api]]
      - model: authentik_core.application
        identifiers:
          slug: authentik-cli
        attrs:
          name: authentik-cli
          provider: !KeyOf authentik-cli
      - model: authentik_endpoints_connectors_agent.agentconnector
        identifiers:
          name: authentik Agent
        attrs:
          enabled: true
          jwt_federation_providers:
            - !KeyOf authentik-cli
  oidc-apps.yaml: |
    version: 1
    metadata:
      name: homeops-oidc-apps
    entries:
      # Immich keeps password login for everyone else; this adds a
      # "Login with Authentik" button that links by email.
      - model: authentik_providers_oauth2.oauth2provider
        id: immich
        identifiers:
          name: immich
        attrs:
          client_type: confidential
          client_id: immich
          client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - {matching_mode: strict, url: "https://photos.iacob.co.uk/auth/login"}
            - {matching_mode: strict, url: "https://photos.iacob.co.uk/user-settings"}
            - {matching_mode: strict, url: "https://photos.iacob.uk/auth/login"}
            - {matching_mode: strict, url: "https://photos.iacob.uk/user-settings"}
            - {matching_mode: strict, url: "app.immich:///oauth-callback"}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich
          meta_launch_url: https://photos.iacob.uk
