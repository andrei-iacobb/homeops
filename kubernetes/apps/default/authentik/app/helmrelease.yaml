---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: "2026.8.7"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: default
  values:
    global:
      # Patched rebuild (andrei/patched-images): pip/setuptools findings removed.
      image:
        repository: ghcr.io/andrei-iacobb/patched/authentik
        tag: 2026.8.7-p20261128@sha256:c2d3128bf4171f324263a4ee0d858bd515d39021c89d2b8b8f3e7deecee6aa67
    authentik:
      existingSecret:
        secretName: authentik-secret
    blueprints:
      configMaps:
        - authentik-blueprints
    postgresql:
      enabled: false
    server:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
