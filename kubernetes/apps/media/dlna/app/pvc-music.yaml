---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dlna-music-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.67
    path: /mnt/plex/media/music
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dlna-music
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: dlna-music-pv
  resources:
    requests:
      storage: 500Gi
