---
# Media namespace: allow ingress from envoy gateway, intra-namespace, and health probes
# Media apps communicate with each other (arr suite) and are accessed via envoy gateway
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-ingress
  namespace: media
spec:
  endpointSelector: {}
  ingress:
    # Envoy Gateway ingress (HTTPRoutes)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
    # Intra-namespace (arr apps talking to each other, prowlarr↔sonarr/radarr, etc.)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
    # Default namespace (pulsarr and other default apps may query arr APIs)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
    # Monitoring namespace (prometheus scraping, if ServiceMonitors added later)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    # Plex/Jellyfin direct access from LAN clients (VLAN 1 + VLAN 20 main client
    # VLAN, where the Apple TV/phones/laptops live) + UniFi WireGuard VPN clients.
    # Without VLAN 20 the Apple TV falls back to the OCI relay and buffers 4K.
    - fromCIDR:
        - 192.168.1.0/24
        - 192.168.2.0/24
        - 192.168.20.0/24
    # Kubelet health probes
    - fromEntities:
        - host
