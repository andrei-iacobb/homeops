---
# Devbox preview apps - dev servers on devbox (192.168.1.216), internal only.
# A front proxy on devbox (~/.config/devbox-apps-envoy/envoy.yaml) routes by
# Host header to each sandbox. Add an app: add its hostname here and a matching
# virtual host there.
apiVersion: v1
kind: Service
metadata:
  name: devbox-apps
  namespace: external-services
  labels:
    app.kubernetes.io/name: devbox-apps
spec:
  ports:
    - name: http
      port: 18080
      protocol: TCP
      targetPort: 18080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: devbox-apps
  namespace: external-services
  labels:
    kubernetes.io/service-name: devbox-apps
addressType: IPv4
ports:
  - name: http
    appProtocol: http
    protocol: TCP
    port: 18080
endpoints:
  - addresses:
      - "192.168.1.216"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devbox-apps
  namespace: external-services
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - np.iacob.uk
  rules:
    - backendRefs:
        - name: devbox-apps
          port: 18080
