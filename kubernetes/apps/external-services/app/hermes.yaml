---
# Hermes Agent dashboard - VM on dl360, external to the cluster
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: external-services
  labels:
    app.kubernetes.io/name: hermes
spec:
  ports:
    - name: http
      port: 9119
      protocol: TCP
      targetPort: 9119
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes
  namespace: external-services
  labels:
    kubernetes.io/service-name: hermes
addressType: IPv4
ports:
  - name: http
    appProtocol: http
    protocol: TCP
    port: 9119
endpoints:
  - addresses:
      - "192.168.1.73"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: external-services
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - hermes.iacob.uk
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
