---
# devbox - T3 Code server on devbox (Proxmox VM 102, user unit t3code).
# T3 has its own pairing auth; SSO is bypassed in sso-bypass.yaml.
apiVersion: v1
kind: Service
metadata:
  name: devbox
  namespace: external-services
  labels:
    app.kubernetes.io/name: devbox
spec:
  ports:
    - name: http
      port: 3773
      protocol: TCP
      targetPort: 3773
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: devbox
  namespace: external-services
  labels:
    kubernetes.io/service-name: devbox
addressType: IPv4
ports:
  - name: http
    appProtocol: http
    protocol: TCP
    port: 3773
endpoints:
  - addresses:
      - "192.168.1.216"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devbox
  namespace: external-services
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - devbox.iacob.uk
  rules:
    - backendRefs:
        - name: devbox
          port: 3773
