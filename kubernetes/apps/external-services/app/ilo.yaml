---
# HP iLO 4 (DL360 G9 at .175, DL380 G9 at .180)
#
# These are NOT reached with an Envoy Backend like the other external services.
# Envoy's BoringSSL cannot complete a TLS handshake with iLO 4 firmware: the BMC
# answers the ClientHello with a handshake_failure alert, and every Backend TLS
# knob was tried without effect (version floor and ceiling, ALPN off and forced
# to http/1.1, explicit cipher lists including non-ECDHE, single curve, SNI
# override). OpenSSL and Chromium both connect to the same BMCs without trouble,
# from inside the cluster as well as outside, so the network path is fine.
#
# So a small nginx sits in between: OpenSSL upstream to the BMC, plain HTTP
# downstream to Envoy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ilo-proxy
  namespace: external-services
data:
  ilo.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 8080;
      server_name ilo1.iacob.uk;
      location / {
        proxy_pass https://192.168.1.175;
        include /etc/nginx/conf.d/ilo-common.inc;
      }
    }

    server {
      listen 8080;
      server_name ilo2.iacob.uk;
      location / {
        proxy_pass https://192.168.1.180;
        include /etc/nginx/conf.d/ilo-common.inc;
      }
    }

    server {
      listen 8080 default_server;
      return 404;
    }
  ilo-common.inc: |
    # The BMC certificate is self-signed and its TLS stack tops out at 1.2.
    proxy_ssl_verify off;
    proxy_ssl_protocols TLSv1.2;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The HTML5 remote console is a websocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # iLO is slow to answer and the console holds the connection open.
    proxy_connect_timeout 15s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilo-proxy
  namespace: external-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ilo-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ilo-proxy
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            # nginx-unprivileged writes proxy temp files under /tmp.
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: conf
          configMap:
            name: ilo-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: ilo-proxy
  namespace: external-services
spec:
  selector:
    app.kubernetes.io/name: ilo-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ilo1
  namespace: external-services
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - ilo1.iacob.uk
  rules:
    - backendRefs:
        - name: ilo-proxy
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ilo2
  namespace: external-services
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - ilo2.iacob.uk
  rules:
    - backendRefs:
        - name: ilo-proxy
          port: 8080
