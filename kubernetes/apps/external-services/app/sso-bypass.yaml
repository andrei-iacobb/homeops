---
# See kubernetes/apps/default/sso-bypass.yaml. OpenClaw nodes and apps talk to
# the gateway over websockets with their own token.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sso-bypass
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: openclaw
  authorization:
    defaultAction: Allow
