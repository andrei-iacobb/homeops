---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner-immich
spec:
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner-immich
  interval: 1h
  values:
    # Patched rebuild (andrei/patched-images). It uses current client-go, whose
    # leader election needs a Lease the chart does not grant; one replica with
    # Recreate needs no election.
    image:
      repository: ghcr.io/andrei-iacobb/patched/nfs-subdir-external-provisioner
      tag: v4.0.2-p20261128@sha256:7c63c0948eff6fc33a5df791e95a009a22053b91f451856e1d30d2ff521c984c
    leaderElection:
      enabled: false
    strategyType: Recreate
    nfs:
      server: 192.168.1.67
      path: /mnt/SSD/immich
    storageClass:
      create: false
    replicaCount: 1
    provisionerName: cluster.local/nfs-subdir-external-provisioner-immich
