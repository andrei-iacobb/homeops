---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chart:
    spec:
      chart: volsync
      sourceRef:
        kind: HelmRepository
        name: backube
      version: "0.17.0"
  interval: 1h
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Patched rebuild (andrei/patched-images) for the operator and every mover.
    image: &volsync
      repository: ghcr.io/andrei-iacobb/patched/volsync
      tag: 0.17.0-p20261128@sha256:ebc36b052e6f7ad5c6a6c606d3dd2f5e5aa736a06f59f5bdc461b37398e73aa4
    rclone: *volsync
    restic: *volsync
    rsync: *volsync
    rsync-tls: *volsync
    syncthing: *volsync
    metrics:
      disableAuth: true
