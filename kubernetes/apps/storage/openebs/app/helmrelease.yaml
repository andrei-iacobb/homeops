---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chart:
    spec:
      chart: openebs
      sourceRef:
        kind: HelmRepository
        name: openebs
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Patched rebuild (andrei/patched-images) of the hostpath provisioner.
    localpv-provisioner:
      localpv:
        image:
          registry: ghcr.io/
          repository: andrei-iacobb/patched/openebs-provisioner-localpv
          tag: 4.6.0-p20261128@sha256:c637f314f2f0fbaa432a6f1e15505c2a862d184cc4c6ab9aa8d0fe60edcec150
    engines:
      replicated:
        mayastor:
          enabled: false
      local:
        hostpath:
          enabled: true
          basePath: /var/openebs/local
        lvm:
          enabled: false
        zfs:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
