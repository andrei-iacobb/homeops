---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    instance:
      distribution:
        artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.64.0
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        # Forgejo-primary (2026-07-15): Flux pulls from Forgejo; GitHub is a
        # ff-only mirror pushed by .forgejo/workflows/push-to-github.yaml.
        url: "https://git.iacob.co.uk/andrei/homeops.git"
        ref: "refs/heads/main"
        path: kubernetes/flux/cluster
        pullSecret: flux-git-auth
      commonMetadata:
        labels:
          app.kubernetes.io/name: flux
      kustomize:
        patches:
          - # Patched rebuild (andrei/patched-images). When the distribution
            # artifact moves, rebuild and move these pins in the same commit.
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/andrei-iacobb/patched/flux-helm-controller:v1.7.2-p20261128@sha256:0c3598361fb531e8675280f900df86af04db323122248b454449651e765754df
            target:
              kind: Deployment
              name: helm-controller
          - # Patched rebuild (andrei/patched-images), see above.
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/andrei-iacobb/patched/flux-kustomize-controller:v1.10.2-p20261128@sha256:7b344c4f8cb43fe51118368d699011e4fa2316dfbe58532adf092d10664de87d
            target:
              kind: Deployment
              name: kustomize-controller
          - # Patched rebuild (andrei/patched-images), see above.
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: ghcr.io/andrei-iacobb/patched/flux-notification-controller:v1.10.1-p20261128@sha256:7a0674573d9682b9adacebb588c900ec50af014e2a3b22d1946d9b6de3dcbd37
            target:
              kind: Deployment
              name: notification-controller
          - # Increase the number of workers
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=5s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Increase the memory limits
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 1Gi
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Enable in-memory kustomize builds
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=20
              - op: replace
                path: /spec/template/spec/volumes/0
                value:
                  name: temp
                  emptyDir:
                    medium: Memory
            target:
              kind: Deployment
              name: kustomize-controller
          - # Enable Helm repositories caching
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m
            target:
              kind: Deployment
              name: source-controller
          - # Flux near OOM detection for Helm
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=500ms
            target:
              kind: Deployment
              name: helm-controller
          - # Disable chart digest tracking
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DisableChartDigestTracking=true
            target:
              kind: Deployment
              name: helm-controller
          - # Controller-level SOPS decryption
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --sops-age-secret=sops-age
            target:
              kind: Deployment
              name: kustomize-controller
          - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: (helm-controller|kustomize-controller)
          - # Cancel health checks on new Kustomizations revisions
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
