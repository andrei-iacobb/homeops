# Ring motion events become native motion sensors for Alexa.
# Each event produces a 30-second pulse; old events do not replay on startup.
template:
  - triggers:
      - trigger: state
        entity_id: event.front_door_motion
      - trigger: homeassistant
        event: start
    binary_sensor:
      - name: Alexa front door motion
        unique_id: alexa_front_door_motion
        device_class: motion
        availability: "{{ not is_state('event.front_door_motion', 'unavailable') }}"
        state: >-
          {{ trigger.platform == 'state'
             and trigger.to_state is not none
             and trigger.to_state.attributes.get('event_type') == 'motion'
             and 0 <= as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0) < 30 }}
        auto_off:
          seconds: 30
