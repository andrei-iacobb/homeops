---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.1.85:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.1.85"
additionalMachineCertSans: *sans

clusterPodNets: ["10.67.0.0/16"]
clusterSvcNets: ["10.41.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "home-cluster"
    ipAddress: "192.168.1.85"
    installDisk: "/dev/vda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515
    controlPlane: true
    networkInterfaces:
      - interface: "ens18"
        dhcp: false
        addresses:
          - "192.168.1.85/24"
        routes:
          - gateway: "192.168.1.1"
            network: 0.0.0.0/0
        mtu: 1500
      # ens19: 10G p2p NFS link to TrueNAS (10.10.10.3)
      - interface: "ens19"
        dhcp: false
        addresses:
          - "10.10.10.2/31"
        mtu: 9000
      # 10G p2p link dl360<->dl380 (vmbr12) to the gpu-worker
      - deviceSelector:
          hardwareAddr: "bc:24:11:0a:11:42"
        dhcp: false
        addresses:
          - "10.10.20.12/24"
        mtu: 9000
  - hostname: "gpu-worker"
    ipAddress: "192.168.1.86"
    installDisk: "/dev/vda"
    machineSpec:
      secureboot: false
    # schematic: qemu-guest-agent + nonfree-kmod-nvidia-production + nvidia-container-toolkit-production
    talosImageURL: factory.talos.dev/installer/52223d70cd62926d81b640384b2ab9a5e9063d0613952e14e93b9702cdf8f625
    controlPlane: false
    nodeLabels:
      nvidia.com/gpu.present: "true"
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:0a:11:40"
        dhcp: false
        addresses:
          - "192.168.1.86/24"
        routes:
          - gateway: "192.168.1.1"
            network: 0.0.0.0/0
        mtu: 1500
      # 10G p2p link dl380<->dl360 (vmbr12)
      - deviceSelector:
          hardwareAddr: "bc:24:11:0a:11:41"
        dhcp: false
        addresses:
          - "10.10.20.11/24"
        mtu: 9000

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"

# Worker patches
worker:
  patches:
    - "@./patches/worker/nvidia.yaml"
